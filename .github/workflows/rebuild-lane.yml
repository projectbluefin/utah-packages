name: Build one package factory lane

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      packages:
        required: true
        type: string
      runner:
        required: true
        type: string
      timeout:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    # Never run two copies of an expensive package build concurrently. A newer
    # run waits for the current one and can reuse its checkpointed result.
    concurrency:
      group: utah-package-${{ inputs.lane }}-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the compiler cache policy
        id: cache_policy
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          if [ "$(python3 tools/recipe.py "$PACKAGE" cache)" = true ]; then
            echo "ref=ghcr.io/${owner}/utah-packages-ccache" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR for the compiler cache
        if: steps.cache_policy.outputs.ref != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: ./.github/actions/setup-sccache
        with:
          package: ${{ matrix.package }}
          cache_ref: ${{ steps.cache_policy.outputs.ref }}
      - name: Seed prior RPMs from the building accumulator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          mkdir -p work/prior
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
          if podman pull "ghcr.io/${owner}/utah-packages:building" 2>/dev/null; then
            # podman 5 refuses to create a container from an image that declares
            # no command, and every one of these is FROM scratch plus a COPY. The
            # command is never run -- the container exists only for podman cp --
            # but it has to be there or create exits 125 with
            #   no command or entrypoint provided, and no CMD or ENTRYPOINT from image
            container=$(podman create "ghcr.io/${owner}/utah-packages:building" /bin/true)
            podman cp "$container:/repository/." work/prior/ 2>/dev/null || true
            podman rm "$container" >/dev/null 2>&1 || true
            echo "seeded work/prior from :building accumulator"
          fi

      # Overlay this run last: the shared accumulator may still hold an older
      # build at the same RPM filename and must not overwrite fresh lane output.
      - name: Collect RPMs built by earlier lanes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-*
          path: work/prior
          merge-multiple: true
        continue-on-error: true

      - name: Add best-effort swap for Firefox PGO/LTO
        if: matrix.package == 'firefox'
        run: |
          set -euo pipefail
          available_gib=$(df --output=avail -BG "$RUNNER_TEMP" | tail -n1 | tr -dc 0-9)
          if [ "$available_gib" -lt 20 ]; then
            echo "Only ${available_gib} GiB free; skipping extra swap to preserve build disk" >&2
            exit 0
          fi
          swapfile="$RUNNER_TEMP/firefox-pgo.swap"
          sudo fallocate -l 12G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile" || { echo "Host does not permit extra swap" >&2; exit 0; }
          free -h
      - name: Fetch and verify direct upstream source
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 tools/source_pipeline.py "$PACKAGE" --output work/sources --report-dir work/reports
      - name: Build the verified source with its RPM recipe
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          bash tools/build-package.sh "$PACKAGE" --work work --engine docker --no-fetch
      - name: Preserve build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs-${{ inputs.lane }}-${{ matrix.package }}
          path: |
            work/logs/**
            work/reports/**
          retention-days: 14
      # The recipe prints the statistics that matter from inside the
      # container, where the compiles happen. Running the client here would
      # start a second server against the same directory and report its own
      # empty counters, which is what hid the broken cache until now.
      - name: Publish the compiler cache
        if: always() && steps.cache_policy.outputs.ref != ''
        env:
          PACKAGE: ${{ matrix.package }}
          CACHE_REF: ${{ steps.cache_policy.outputs.ref }}
        run: |
          set -uo pipefail
          test -d work/sccache || exit 0
          # The build container runs as root and sccache creates its shard
          # directories 0700, so every path under here belongs to root and is
          # unreadable to the runner user. The first version of this step
          # tested for content with find, which printed Permission denied to
          # stderr, nothing to stdout, and skipped the publish without
          # failing. Take ownership before looking.
          sudo chown -R "$(id -u):$(id -g)" work/sccache || exit 0
          test -n "$(find work/sccache -type f -print -quit)" || exit 0
          tag="$(printf '%s' "$PACKAGE" | tr -c 'a-zA-Z0-9_.-' '-')"
          ref="${CACHE_REF}:${tag}"
          # The context is the cache directory alone. Handing podman the
          # repository root would send the built RPMs and the seeded
          # accumulator through the build as well.
          containerfile="$RUNNER_TEMP/Containerfile.ccache"
          printf 'FROM scratch\nCOPY . /sccache\n' > "$containerfile"
          echo "Publishing $(du -sh work/sccache | cut -f1) of compiler cache to $ref"
          podman build --tag "$ref" --file "$containerfile" work/sccache || exit 0
          podman push "$ref" || echo "cache push failed; the next build recompiles"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-${{ inputs.lane }}-${{ matrix.package }}
          path: |
            work/result/**/*.rpm
            work/result/*.build-key.json
            work/reports/*.json
          if-no-files-found: error
          retention-days: 14
