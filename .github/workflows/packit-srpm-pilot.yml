name: Packit SRPM pilot

# Verification-only pilot: proves `packit srpm` works end-to-end against real
# packages in this monorepo, using the pinned upstream `quay.io/packit/packit`
# image (see docs/architecture.md and docs/packit-reuse-research.md -- this
# repo deliberately does not build its own Packit image, PRs #36-#40).
#
# Scope and rationale: docs/superpowers/specs/2026-09-05-packit-srpm-pilot-design.md
#
# This job is additive and does not touch rebuild-rpms.yml: it does not feed
# the produced SRPM into Mock, the RPM overlay, or the published repository.
# Packages without a root-level packit config entry, and every per-package
# .packit.yaml/README.packit leftover from the original Fedora dist-git import,
# are untouched.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .packit.yaml
      - config/upstream-sources.json
      - packages/**/*.spec
      - .github/workflows/packit-srpm-pilot.yml
      - tools/packit_source0.py
      - tools/source_pipeline.py
      - tools/packit_workflow.py
  pull_request:
    paths:
      - .packit.yaml
      - config/upstream-sources.json
      - packages/**/*.spec
      - .github/workflows/packit-srpm-pilot.yml
      - tools/packit_source0.py
      - tools/source_pipeline.py
      - tools/packit_workflow.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      chunks: ${{ steps.packages.outputs.chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: packages
        run: |
          # Capture the substitution before writing it. "echo $(cmd) >> file"
          # reports echo's status, not the command's, so a discovery failure
          # would leave packages= behind a green job -- and an empty list is a
          # matrix that runs nothing while the workflow still passes. Both
          # failure modes are a green build that tested no package at all.
          packages="$(python3 tools/packit_workflow.py packages)"
          count=$(printf '%s' "$packages" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$count" -gt 0
          echo "discovered $count packages"
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"
          # The guard above only proves the list is non-empty. It cannot see
          # the case that actually happened: 345 packages against a 256-job
          # matrix cap, which expands to no jobs at all and fails the run
          # underneath this green step. Chunk so no matrix exceeds the cap.
          chunks="$(python3 tools/packit_workflow.py chunks)"
          printf 'chunks=%s\n' "$chunks" >> "$GITHUB_OUTPUT"

  srpm:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.discover.outputs.chunks) }}
    uses: ./.github/workflows/packit-srpm-chunk.yml
    with:
      packages: ${{ matrix.chunk }}
