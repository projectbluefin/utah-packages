name: Packit SRPM pilot

# Verification-only pilot: proves `packit srpm` works end-to-end against real
# packages in this monorepo, using the pinned upstream `quay.io/packit/packit`
# image (see docs/architecture.md and docs/packit-reuse-research.md -- this
# repo deliberately does not build its own Packit image, PRs #36-#40).
#
# Scope and rationale: docs/superpowers/specs/2026-09-05-packit-srpm-pilot-design.md
#
# This job is additive and does not touch rebuild-rpms.yml: it does not feed
# the produced SRPM into Mock, the RPM overlay, or the published repository.
# Packages without a root-level packit config entry, and every per-package
# .packit.yaml/README.packit leftover from the original Fedora dist-git import,
# are untouched.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .packit.yaml
      - config/upstream-sources.json
      - packages/**/*.spec
      - .github/workflows/packit-srpm-pilot.yml
      - tools/packit_source0.py
      - tools/source_pipeline.py
      - tools/packit_workflow.py
  pull_request:
    paths:
      - .packit.yaml
      - config/upstream-sources.json
      - packages/**/*.spec
      - .github/workflows/packit-srpm-pilot.yml
      - tools/packit_source0.py
      - tools/source_pipeline.py
      - tools/packit_workflow.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: packages
        run: |
          # Capture the substitution before writing it. "echo $(cmd) >> file"
          # reports echo's status, not the command's, so a discovery failure
          # would leave packages= behind a green job -- and an empty list is a
          # matrix that runs nothing while the workflow still passes. Both
          # failure modes are a green build that tested no package at all.
          packages="$(python3 tools/packit_workflow.py packages)"
          count=$(printf '%s' "$packages" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$count" -gt 0
          echo "discovered $count packages"
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

  srpm:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch and stage verified sources
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 tools/source_pipeline.py "$PACKAGE" \
            --output work/sources \
            --report-dir work/reports \
            --stage-into packages
      - name: packit srpm
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p work/srpm
          docker run --rm \
            -e PACKAGE \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/srpm:/out:Z" \
            -w /repo \
            quay.io/packit/packit@sha256:8a1784251c51eed7a094820c894e2ee7f4ed4bbce4eb78eb172a04de3fae43e1 bash -exc '
              git config --global --add safe.directory "*"
              packit srpm --preserve-spec --output "/out/$PACKAGE.src.rpm" -p "$PACKAGE"
              python3 tools/source_pipeline.py "$PACKAGE" --verify-staged packages
              rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}\n" "/out/$PACKAGE.src.rpm"
            '
          # A build that produced no SRPM must fail here, matching the same
          # empty-artifact failure mode rebuild-rpms.yml already guards
          # against: an upload with no matching file cannot be trusted to
          # fail the job on its own. The ubuntu-24.04 runner has no rpm
          # command, so the rpm -qp check above runs inside the container;
          # this is just the file-presence guard for the upload step below.
          test -s "work/srpm/$PACKAGE.src.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packit-srpm-${{ matrix.package }}
          path: work/srpm/${{ matrix.package }}.src.rpm
          if-no-files-found: error
