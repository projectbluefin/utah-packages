# One chunk of the Packit SRPM pilot.
#
# Exists only because GitHub caps a matrix at 256 jobs and expands a larger one
# to nothing at all. The pilot enumerates every package in the monorepo -- 345
# of them -- so its matrix produced zero srpm jobs and the run failed with a
# green discover step above it, which is exactly the failure the discover guard
# was written to prevent and could not see. The caller hands this workflow one
# chunk at a time; per-package parallelism is unchanged.
name: Packit SRPM chunk

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of package names to build SRPMs for.
        required: true
        type: string

permissions:
  contents: read

jobs:
  srpm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # gcc is the one recipe whose Source0 comes from git rather than a
      # release tarball, and asking gcc.gnu.org for it from every concurrent
      # run is what earned a 429. Packit solves the same problem with a local
      # reference repository (packit/utils/repo.py, RepositoryCache): keep the
      # objects, and a repeated fetch costs no network. The key is the spec, so
      # it changes exactly when the pinned revision does, and a miss seeds the
      # mirror for the next run instead of failing.
      - name: Reuse a cached git mirror for the one git-sourced recipe
        if: matrix.package == 'gcc'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: work/git-mirror
          key: git-mirror-gcc-${{ hashFiles('packages/gcc/gcc.spec') }}
      - name: Fetch and stage verified sources
        env:
          PACKAGE: ${{ matrix.package }}
          FACTORY_GIT_MIRROR: ${{ github.workspace }}/work/git-mirror
        run: |
          python3 tools/source_pipeline.py "$PACKAGE" \
            --output work/sources \
            --report-dir work/reports \
            --stage-into packages
      - name: packit srpm
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p work/srpm
          # The image below is quay.io/packit/packit:latest as of 2026-09-09,
          # the only tag that repository publishes. The previous pin
          # (sha256:149e6e06...c947494) was garbage-collected when upstream
          # republished latest, and `docker run` then failed with
          # `manifest unknown` before the container started -- exit 125 on
          # every srpm job, on every branch. Renovate does not track this pin:
          # its github-actions manager reads `container:` and `services:`, not
          # an image named inside a `run:` script.
          #
          # Keep this comment out of the `docker run` continuation below. A
          # comment line after a trailing `\` is joined onto the command and
          # then swallows the rest of it, so the image and the bash argument
          # vanish and docker answers `'docker run' requires at least 1
          # argument`.
          docker run --rm \
            -e PACKAGE \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/srpm:/out:Z" \
            -w /repo \
            quay.io/packit/packit@sha256:8a1784251c51eed7a094820c894e2ee7f4ed4bbce4eb78eb172a04de3fae43e1 bash -exc '
              git config --global --add safe.directory "*"
              packit srpm --preserve-spec --output "/out/$PACKAGE.src.rpm" -p "$PACKAGE"
              python3 tools/source_pipeline.py "$PACKAGE" --verify-staged packages
              rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}\n" "/out/$PACKAGE.src.rpm"
            '
          # A build that produced no SRPM must fail here, matching the same
          # empty-artifact failure mode rebuild-rpms.yml already guards
          # against: an upload with no matching file cannot be trusted to
          # fail the job on its own. The ubuntu-24.04 runner has no rpm
          # command, so the rpm -qp check above runs inside the container;
          # this is just the file-presence guard for the upload step below.
          test -s "work/srpm/$PACKAGE.src.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packit-srpm-${{ matrix.package }}
          path: work/srpm/${{ matrix.package }}.src.rpm
          if-no-files-found: error
