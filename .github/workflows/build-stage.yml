# One dependency stage of the RPM rebuild.
#
# rebuild0 through rebuild4 were five copies of this file, differing only in a
# stage number and a `needs:` list -- four substantive lines out of roughly two
# hundred. Five copies meant five places to fix a build-root bug, and the
# copies had already drifted: a Firefox PGO swap workaround existed only in
# stage 0, so it would have silently stopped applying the moment Firefox was
# solved into a later wave. That recipe is gone -- Utah ships the Flatpak --
# but the drift it caused is why this file is the only copy.
#
# The caller owns ordering. This workflow builds one wave and knows nothing
# about the others beyond the artifacts they left behind.
name: Build one dependency stage

on:
  workflow_call:
    inputs:
      stage:
        description: Stage number, used to name this wave artifacts
        required: true
        type: string
      packages:
        description: JSON array of source package names to build
        required: true
        type: string
      backend:
        description: >
          container (default) builds with bare rpmbuild in a Fedora container
          that hand-simulates a build root. mock builds the SRPM in a real mock
          root, which is what Packit does (packit build in-mock). hermetic
          locks the mock root from real BuildRequires (buildroot_lock.json)
          and builds offline from exactly that lock, the way Hummingbird
          does (tools/hermetic_build.sh). mock and hermetic are opt-in until
          a full run has proven them: the container path is what the
          published repository was built with.
        required: false
        default: hermetic
        type: string
      container_packages:
        description: >
          JSON names that build on the container lane even when backend is
          hermetic: build_lane container in config/upstream-sources.json.
        required: false
        default: ''
        type: string
      factory_image:
        description: >
          The published factory image as prepare resolved it (ref@digest), or
          empty when none exists. Its repository is what prepare skipped
          against, so it is what this build root gets to install from.
        required: false
        default: ''
        type: string
      buildroot_digest:
        description: Digest of the build root prepared for this run.
        required: true
        type: string
      cacheable_packages:
        description: JSON names allowed to reuse an exact package-cache entry.
        required: true
        type: string
      # The three inputs below exist for .github/workflows/canary.yml, which
      # runs this pipeline several times in one workflow run. Every production
      # caller leaves them empty, and empty means exactly the old behaviour.
      artifact_prefix:
        description: Prefix for every artifact name, so canary passes cannot collide.
        required: false
        default: ''
        type: string
      cache_salt:
        description: Canary cache namespace; empty for production keys.
        required: false
        default: ''
        type: string
      perturb:
        description: >
          JSON names whose recipe is altered in this checkout only (a comment
          appended to the spec), so the canary can prove a change to one
          package leaves every other cache key where it was.
        required: false
        default: ''
        type: string
      flaky_check:
        description: >
          Canary only: JSON names whose %check fails on its first run and
          passes on the retry, to prove the retry. They always compile.
        required: false
        default: ''
        type: string
      inject_failure:
        description: >
          Canary only: JSON names whose build fails on purpose, before any
          RPM is produced, so the canary can prove a failed package keeps its
          previous published build and is reported.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    # A canary-injected failure is a real failed job, but an expected one:
    # the canary judges it through verify-failure, so it must not turn the
    # whole canary run red. Every production run leaves inject_failure empty.
    continue-on-error: ${{ inputs.inject_failure != '' && contains(fromJSON(inputs.inject_failure), matrix.package) }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The lane this package builds on: the run's backend, unless the
      # package is one of the declared container-lane exceptions.
      - name: Choose the build lane
        id: lane
        env:
          BACKEND: ${{ inputs.backend }}
          PACKAGE: ${{ matrix.package }}
          EXCEPTION: ${{ inputs.container_packages != '' && contains(fromJSON(inputs.container_packages), matrix.package) && '1' || '' }}
        run: |
          lane="$BACKEND"
          if [ "$BACKEND" = hermetic ] && [ -n "$EXCEPTION" ]; then
            lane=container
            echo "::notice title=container lane::$PACKAGE builds on the container lane (build_lane in config/upstream-sources.json)"
          fi
          echo "backend=$lane" >> "$GITHUB_OUTPUT"
          echo "build lane: $lane"
      - name: Fail this package on purpose for the canary
        if: inputs.inject_failure != '' && contains(fromJSON(inputs.inject_failure), matrix.package)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error title=canary::failing $PACKAGE on purpose (inject_failure)"
          exit 1
      - name: Perturb recipes for the canary
        if: inputs.perturb != ''
        env:
          PERTURB: ${{ inputs.perturb }}
        run: |
          for name in $(jq -r '.[]' <<<"$PERTURB"); do
            spec=$(find "packages/$name" -maxdepth 1 -name '*.spec' -print -quit)
            test -n "$spec"
            printf '\n# canary perturbation %s\n' "$GITHUB_RUN_ID" >> "$spec"
            echo "perturbed $spec"
          done
      - uses: ./.github/actions/setup-sccache
        if: contains(fromJSON('["mozjs140", "webkitgtk"]'), matrix.package)
      - uses: ./.github/actions/load-buildroot
        with:
          artifact: ${{ inputs.artifact_prefix }}buildroot-image
      - uses: ./.github/actions/load-factory-repo
        id: factory
        with:
          image: ${{ inputs.factory_image }}
      # Only strictly earlier waves: a same-stage sibling does not exist for
      # this build (repeated mistake 3). This step used to be missing while
      # the download below still read its output, so the pattern was empty
      # and download-artifact fetched EVERY artifact of the run so far --
      # same-stage siblings that happened to finish first, and the build
      # root tarball -- into work/prior.
      - name: Name the artifacts of earlier stages
        id: prior
        if: inputs.stage != '0'
        env:
          STAGE: ${{ inputs.stage }}
          PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          if [ "$STAGE" -eq 1 ]; then
            stages=0
          else
            stages="{$(seq -s, 0 $((STAGE - 1)))}"
          fi
          echo "pattern=${PREFIX}rpm-s${stages}-*" >> "$GITHUB_OUTPUT"
          echo "earlier stages: ${PREFIX}rpm-s${stages}-*"
      - name: Collect RPMs built by earlier stages
        if: inputs.stage != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ steps.prior.outputs.pattern }}
          path: work/prior
          merge-multiple: true
        continue-on-error: true
      - name: Fetch and verify direct upstream source
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 tools/source_pipeline.py "$PACKAGE" --output work/sources --report-dir work/reports
      # The hermetic lane, phase one, online: mock resolves every
      # BuildRequires -- %generate_buildrequires included -- in a real mock
      # root and records the result, NEVRA by NEVRA with its URL, in
      # buildroot_lock.json. That lock is the build root: the cache key is
      # computed from it below, and the offline build installs exactly it.
      # This is the design review's "rpmspec --buildrequires -> DNF solve ->
      # buildroot_lock.json -> build offline", done by mock itself, as
      # Hummingbird's ci/build_rpms.sh --hermetic does.
      - name: Lock the build root from its BuildRequires (hermetic)
        id: hermetic_lock
        if: steps.lane.outputs.backend == 'hermetic'
        env:
          PACKAGE: ${{ matrix.package }}
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
          FLAKY_CHECK: ${{ inputs.flaky_check != '' && contains(fromJSON(inputs.flaky_check), matrix.package) && '1' || '' }}
        run: |
          set -euo pipefail
          DIST_BUMP="$(python3 tools/dist_bump.py "$PACKAGE")"
          BUILDROOT_ICU77="$(python3 -c 'import json,sys;name=sys.argv[1];pkgs=json.loads(open("config/upstream-sources.json").read()).get("packages",[]);entry=next((p for p in pkgs if p.get("name")==name),{});print("true" if entry.get("buildroot_icu77",False) else "false")' "$PACKAGE")"
          # The factory's own pinned build root doubles as mock's bootstrap
          # image, so the bootstrap is the same bytes every job builds with.
          BOOTSTRAP_IMAGE="$(tr -d '[:space:]' < config/buildroot-image)"
          export DIST_BUMP BUILDROOT_ICU77 BOOTSTRAP_IMAGE FLAKY_CHECK
          # podman (inside, for the bootstrap image) and mock both need a
          # real filesystem, not the container's overlay.
          mkdir -p "$RUNNER_TEMP/containers" "$RUNNER_TEMP/mock"
          docker run --rm --privileged \
            -e PACKAGE -e FACTORY_REPO -e DIST_BUMP -e BUILDROOT_ICU77 -e BOOTSTRAP_IMAGE -e FLAKY_CHECK \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            -v "$PWD/tools:/tools:ro,Z" \
            -v "$RUNNER_TEMP/containers:/var/lib/containers:Z" \
            -v "$RUNNER_TEMP/mock:/var/lib/mock:Z" \
            utah-buildroot:run bash /tools/hermetic_build.sh lock
          # The container hands its directories to its own mockbuilder user;
          # give them back, or the cache restore below cannot write
          # work/result (podman cp failed exactly so on the first cache hit).
          sudo chown -R "$(id -u):$(id -g)" work
          echo "locked root: $(wc -l < work/cache/root) packages, disttag $(cat work/cache/disttag)"
      # The hermetic lane keys the cache on its lock, in its own namespace:
      # a container-lane entry must never be restored into a hermetic build.
      - name: Key the package cache from the lock (hermetic)
        id: package_cache_lock
        if: steps.lane.outputs.backend == 'hermetic' && contains(fromJSON(inputs.cacheable_packages), matrix.package)
        env:
          PACKAGE: ${{ matrix.package }}
          BUILDROOT_DIGEST: ${{ inputs.buildroot_digest }}
          CACHE_SALT: ${{ inputs.cache_salt }}
        run: |
          set -euo pipefail
          key=$(python3 tools/package_cache_key.py "$PACKAGE" \
            --buildroot-digest "$BUILDROOT_DIGEST" \
            --disttag "$(cat work/cache/disttag)" \
            --resolved-root work/cache/root \
            --salt "hermetic${CACHE_SALT:+-$CACHE_SALT}")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # A cache key includes the root dnf actually resolved. Resolve it before
      # asking GHCR so a hit cannot cross a build-root boundary. This is cheap
      # beside an RPM compile; a cache hit skips the compile entirely.
      - name: Resolve the package cache key
        id: package_cache
        if: steps.lane.outputs.backend == 'container' && contains(fromJSON(inputs.cacheable_packages), matrix.package) && !contains(fromJSON(inputs.flaky_check || '[]'), matrix.package)
        env:
          PACKAGE: ${{ matrix.package }}
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
          BUILDROOT_DIGEST: ${{ inputs.buildroot_digest }}
          CACHE_SALT: ${{ inputs.cache_salt }}
        run: |
          set -euo pipefail
          mkdir -p work/cache
          DIST_BUMP="$(python3 tools/dist_bump.py "$PACKAGE")"
          export DIST_BUMP
          docker run --rm --privileged \
            -e PACKAGE -e FACTORY_REPO -e DIST_BUMP \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            utah-buildroot:run bash -exc '
              disable=--disablerepo=fedora-cisco-openh264
              sed -i "/^tsflags=nodocs/d" /etc/dnf/dnf.conf
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              if [ -n "$(find /work/prior -name "*.rpm" -print -quit 2>/dev/null)" ]; then
                dnf -y $disable install createrepo_c
                createrepo_c /work/prior
                EXCLUDE=$(find /work/prior -name "*.rpm" -type f -print0 | xargs -0 -r rpm -qp --qf "%{NAME}\n" | sort -u | paste -sd, -)
                printf "[stages]\nname=stages\nbaseurl=file:///work/prior\nenabled=1\ngpgcheck=0\npriority=1\n" > /etc/yum.repos.d/stages.repo
              fi
              HB_EXCLUDE="ruby-default-gems,ruby3.3-default-gems,ruby3.4-default-gems,libicu,icu,gpgme,qt6-qtbase,sqlite,sqlite-libs"
              EXCLUDE="${HB_EXCLUDE}${EXCLUDE:+,}${EXCLUDE}"
              HB_REPO_EXCLUDE="ruby3.3-default-gems,ruby3.4-default-gems"
              if [ -n "${FACTORY_REPO:-}" ]; then
                printf "[factory]\nname=factory\nbaseurl=%s\nenabled=1\ngpgcheck=0\npriority=5\n" "$FACTORY_REPO" > /etc/yum.repos.d/factory.repo
              fi
              dnf -y $disable install dnf-plugins-core mock rpm-build @buildsys-build
              # Same upgrade as the build step below; see the comment there.
              for split in libxml2; do
                rpm -q "$split" >/dev/null 2>&1 || continue
                dnf -y $disable upgrade "$split"
              done
              dnf -y $disable swap sqlite-libs sqlite-libs --allowerasing || true
              DISTTAG=".$(rpm -qa --qf "%{RELEASE}\n" | grep -oE "hum[0-9]+$" | sort -u | head -n1).bfin${DIST_BUMP:-}"
              test "$DISTTAG" != ".bfin"
              spec=$(find "/packages/$PACKAGE" -maxdepth 1 -name "*.spec" -print -quit)
              dnf -y $disable ${EXCLUDE:+--setopt=fedora.excludepkgs="$EXCLUDE"} ${EXCLUDE:+--setopt=updates.excludepkgs="$EXCLUDE"} ${HB_REPO_EXCLUDE:+--setopt=public-hummingbird-x86_64-rpms.excludepkgs="$HB_REPO_EXCLUDE"} builddep -D "_sourcedir /packages/$PACKAGE" "$spec"
              rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n" | sort -u > /work/cache/root
              printf "%s\n" "$DISTTAG" > /work/cache/disttag
            '
          key=$(python3 tools/package_cache_key.py "$PACKAGE" \
            --buildroot-digest "$BUILDROOT_DIGEST" \
            --disttag "$(cat work/cache/disttag)" \
            --resolved-root work/cache/root \
            --salt "$CACHE_SALT")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore package RPM cache
        id: package_cache_restore
        if: (steps.lane.outputs.backend == 'container' || steps.lane.outputs.backend == 'hermetic') && contains(fromJSON(inputs.cacheable_packages), matrix.package) && !contains(fromJSON(inputs.flaky_check || '[]'), matrix.package)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.package_cache.outputs.key || steps.package_cache_lock.outputs.key }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/utah-packages-cache:$KEY"
          if ! echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning title=package cache unavailable::could not authenticate to GHCR"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if podman pull "$image"; then
            container=$(podman create "$image" /bin/true)
            mkdir -p work/result
            podman cp "$container:/rpms/." work/result/
            podman rm "$container"
            test -n "$(find work/result -name '*.rpm' -print -quit)"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "cache hit: $KEY"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "cache miss: $KEY"
          fi
      - name: Build the verified source with its RPM recipe
        if: steps.lane.outputs.backend == 'container' && steps.package_cache_restore.outputs.hit != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          # `prepare` skips any package the published repository already
          # carries at the same version, so the build root MUST be able to
          # reach that repository -- a skipped package is otherwise simply
          # absent. It was, twice: first vars.FACTORY_REPO was unset on
          # pull_request runs and pipewire-libs-extra failed on
          # `No match for argument: pkgconfig(libfreeaptx)` while
          # libfreeaptx-devel sat published and skipped; then both halves read
          # the same URL, and the URL was a retired Pages mirror. Now both read
          # the repository extracted from the one image prepare resolved, as a
          # local file:// repo, so they cannot disagree and nothing is fetched
          # over HTTP mid-build.
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
          # Canary only; see the flaky_check input. An expression inside the
          # run script below would make GitHub evaluate the whole script as
          # one expression, which is over its 21000-character limit.
          FLAKY_CHECK: ${{ inputs.flaky_check != '' && contains(fromJSON(inputs.flaky_check), matrix.package) && '1' || '' }}
        run: |
          test -d "packages/$PACKAGE"
          mkdir -p work/result
          # Per-package, so it is resolved out here rather than inside the
          # container, which only sees config/ and packages/.
          DIST_BUMP="$(python3 tools/dist_bump.py "$PACKAGE")"
          export DIST_BUMP
          # Whether the build root may admit Hummingbird libicu-77. By default
          # every factory package excludes it so nothing links .so.77 -- the
          # runtime carries only libicu 78. A package that genuinely needs it
          # (e.g. libvdpau, which pulls in TeX Live for doxygen) opts in with
          # "buildroot_icu77": true in config/upstream-sources.json.
          BUILDROOT_ICU77="$(python3 -c 'import json,sys;name=sys.argv[1];pkgs=json.loads(open("config/upstream-sources.json").read()).get("packages",[]);entry=next((p for p in pkgs if p.get("name")==name),{});print("true" if entry.get("buildroot_icu77",False) else "false")' "$PACKAGE")"
          export BUILDROOT_ICU77
          docker run --rm --privileged \
            -e PACKAGE -e FACTORY_REPO -e DIST_BUMP -e BUILDROOT_ICU77 -e FLAKY_CHECK \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            -v "$PWD/tools:/tools:ro,Z" \
            utah-buildroot:run bash -ex /tools/build_container.sh
      # The hermetic lane, phase two: materialize the lock into a local
      # repository, then build in a network namespace with no interface but
      # loopback. Nothing the build installs or fetches can come from
      # anywhere but the lock.
      - name: Build offline from the lock (hermetic)
        if: steps.lane.outputs.backend == 'hermetic' && steps.package_cache_restore.outputs.hit != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e PACKAGE \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            -v "$PWD/tools:/tools:ro,Z" \
            -v "$RUNNER_TEMP/containers:/var/lib/containers:Z" \
            -v "$RUNNER_TEMP/mock:/var/lib/mock:Z" \
            utah-buildroot:run bash /tools/hermetic_build.sh build
          sudo chown -R "$(id -u):$(id -g)" work
      - name: Publish package RPM cache
        if: success() && (steps.lane.outputs.backend == 'container' || steps.lane.outputs.backend == 'hermetic') && contains(fromJSON(inputs.cacheable_packages), matrix.package) && !contains(fromJSON(inputs.flaky_check || '[]'), matrix.package) && steps.package_cache_restore.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.package_cache.outputs.key || steps.package_cache_lock.outputs.key }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          test -n "$(find work/result -name '*.rpm' -print -quit)"
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/utah-packages-cache:$KEY"
          printf 'FROM scratch\nCOPY work/result /rpms\n' > Containerfile.package-cache
          if ! echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning title=package cache unavailable::could not authenticate to GHCR"
            exit 0
          fi
          podman build --tag "$image" --file Containerfile.package-cache . \
            && podman push "$image" \
            || echo "::warning title=package cache publish failed::the build artifact remains valid; a later run will rebuild this package"
      # The mock backend, which is what Packit uses locally
      # (packit build in-mock -> mock --root <cfg> <srpm>). The step above
      # hand-simulates a build root in a plain container; mock gives a real one,
      # clean per package, with the macros and groups a build root is supposed
      # to have. Opt-in until a full run has proven it: dispatch the rebuild
      # with backend=mock. The container path is what the published repository
      # was built with.
      #
      # Like every other build script here, this is the body of bash -exc with
      # single quotes, so it must not contain one -- tools/check_workflow_quoting.py
      # fails the run if it does, and only covers this form.
      - name: Build the verified source in a mock root
        if: steps.lane.outputs.backend == 'mock'
        env:
          PACKAGE: ${{ matrix.package }}
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
        run: |
          test -d "packages/$PACKAGE"
          mkdir -p work/result work/srpm work/mock
          DIST_BUMP="$(python3 tools/dist_bump.py "$PACKAGE")"
          export DIST_BUMP
          docker run --rm --privileged \
            -e PACKAGE -e FACTORY_REPO -e DIST_BUMP \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/tools:/tools:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            utah-buildroot:run bash -exc '
              dnf -y install mock rpm-build python3
              # Whatever an earlier stage built, Fedora must not answer for.
              # Same rule the container path applies, from the same artifacts.
              PRIOR=
              if [ -n "$(find /work/prior -name "*.rpm" -print -quit 2>/dev/null)" ]; then
                dnf -y install createrepo_c
                createrepo_c /work/prior
                PRIOR=$(find /work/prior -name "*.rpm" -type f -print0 \
                  | xargs -0 -r rpm -qp --qf "%{NAME}\n" 2>/dev/null \
                  | sort -u | paste -sd, -)
                STAGES=/work/prior
              fi
              python3 /tools/mock_config.py \
                --output /work/mock/utah.cfg \
                --factory-repo "${FACTORY_REPO:-}" \
                --stages-dir "${STAGES:-}" \
                --prior-built "$PRIOR"
              # The disttag is read from the Hummingbird packages in the root
              # rather than hardcoded, exactly as the container path does it, so
              # a move to hum2 carries itself. Here that means asking the mock
              # root, because that root is what does the building.
              mock --root /work/mock/utah.cfg --init
              HUM_TAG=$(mock --root /work/mock/utah.cfg --quiet --chroot -- \
                rpm -qa --qf "%{RELEASE}\n" | grep -oE "hum[0-9]+$" | sort -u | head -n1)
              if [ -z "$HUM_TAG" ]; then
                echo "No Hummingbird package in the mock root; cannot derive a disttag" >&2
                exit 1
              fi
              DISTTAG=".${HUM_TAG}.bfin${DIST_BUMP:-}"
              echo "disttag: $DISTTAG"
              rpmbuild -bs \
                --define "_topdir /work/rpmbuild" \
                --define "_sourcedir /work/sources/$PACKAGE" \
                --define "_srcrpmdir /work/srpm" \
                --define "dist $DISTTAG" \
                /packages/$PACKAGE/*.spec
              # No debuginfo, for the reasons the container lane gives --
              # both defines, or the MinGW specs fail on orphaned .debug files.
              # A failed %check is retried once, as in the container lane;
              # mock writes the rpmbuild output to build.log in the resultdir.
              mock_rebuild() {
                mock --root /work/mock/utah.cfg \
                  --resultdir /work/result \
                  --define "dist $DISTTAG" \
                  --define "debug_package %{nil}" \
                  --define "__debug_install_post %{nil}" \
                  --rebuild /work/srpm/*.src.rpm
              }
              status=0
              mock_rebuild || status=$?
              if [ "$status" -ne 0 ] && grep -qE "Bad exit status from .*\(%check\)" /work/result/build.log; then
                echo "::warning title=flaky %check retry::$PACKAGE failed in %check (exit $status); retrying the build once"
                mkdir -p "/work/reports/check/$PACKAGE/attempt-1"
                cp /work/result/*.log "/work/reports/check/$PACKAGE/attempt-1/" || true
                status=0
                mock_rebuild || status=$?
                if [ "$status" -eq 0 ]; then
                  echo "::warning title=flaky %check::$PACKAGE failed %check once and passed on retry"
                  printf "%s\n" "$PACKAGE" > /work/reports/flaky-check
                fi
              fi
              test "$status" -eq 0
              find /work/result -name "*.rpm" -type f -print0 | \
                xargs -0 -r rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n"
              # Same guard as the container path: an upload that finds no RPM
              # still succeeds, because the artifact also carries reports.
              test -n "$(find /work/result -name "*.rpm" -type f -print -quit)"
            '
      - name: Report a %check that passed only on its retry
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ -f work/reports/flaky-check ]; then
            echo "- \`$PACKAGE\` failed \`%check\` once and passed on retry; its RPMs are from the retry" >> "$GITHUB_STEP_SUMMARY"
          fi
      # What went into the package, recorded: every NEVRA with its source URL
      # and header digest, the bootstrap image by digest, and the mock
      # config with its hash. Kept even when the build fails.
      - name: Upload the build-root lock (hermetic)
        if: always() && steps.hermetic_lock.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}lock-s${{ inputs.stage }}-${{ matrix.package }}
          path: |
            work/hermetic/lock/buildroot_lock.json
            work/hermetic/mock.cfg
            work/hermetic/mock.cfg.sha256
          if-no-files-found: error
          retention-days: 30
      # Its own upload, and only on failure: the RPM artifact below declares
      # if-no-files-found: error, so a build that produced nothing cannot carry
      # this out with it.
      - name: Upload the evidence from a failed %check
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}check-s${{ inputs.stage }}-${{ matrix.package }}
          path: work/reports/check/**
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}rpm-s${{ inputs.stage }}-${{ matrix.package }}
          # Debuginfo and debugsource are excluded deliberately. No
          # BuildRequires ever names one, so a later stage has no use for them,
          # and they are more than half the bytes. Uploading them cost the run
          # its artifact budget: seven stage 0 jobs died on
          #   Failed to FinalizeArtifact: (403) Forbidden
          # which is not a package failure and reads exactly like one.
          path: |
            work/result/**/*.rpm
            !work/result/**/*-debuginfo-*.rpm
            !work/result/**/*-debugsource-*.rpm
            !work/result/**/*-debuginfo-common-*.rpm
            work/reports/*.json
          if-no-files-found: error
