name: Import Rawhide package

# Imports one Fedora dist-git recipe into this factory and keeps its package
# name in agreement across packages/, the source lock, and .packit.yaml
# (`tests/test_recipe_set_agreement.py`). No document quotes inventory
# counts, so an import edits no prose.
#
# Bootstrap runs in the pinned image because it needs rpmspec. It writes an
# isolated --output candidate and --report, without --merge. A fresh proposal
# job uses tools/import_proposal.py to validate the uploaded data and merge
# the candidate into the source lock, then regenerates .packit.yaml. The
# bootstrap report is diagnostic data carried in
# the pull request, not another inventory compared by the agreement gate.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Fedora dist-git package name to import
        required: true
        type: string
      branch:
        description: Upstream branch
        required: true
        default: rawhide
        type: string

permissions: {}

jobs:
  import:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The checkout's `.git/config` carries the GITHUB_TOKEN credential
          # inside the mounted workspace; an unreviewed rpmspec expansion
          # (an imported dist-git spec the next step just fetched) could read
          # it. Disable the credential helper so that path is closed; the
          # docker run itself only passes -e PACKAGE.
          persist-credentials: false
      - name: Install test dependencies
        # ubuntu-24.04 does not ship pytest / pyyaml; the gate step below
        # imports yaml (tests/test_packit_srpm.py) and runs the full unit
        # suite.
        run: |
          python3 -m pip install --quiet \
            pytest==8.3.5 \
            pyyaml==6.0.3
      - name: Import Fedora dist-git snapshot
        env:
          PACKAGE: ${{ inputs.package }}
          BRANCH: ${{ inputs.branch }}
        run: |
          python3 tools/import_rawhide.py \
            "$PACKAGE" \
            --branch "$BRANCH"
      - name: Lock the upstream source in isolation
        # Specs can execute macros. They see immutable tools/recipe data and
        # one disposable output directory, never host scripts or credentials.
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python3 -c 'import pathlib, sys; p = pathlib.Path("packages") / sys.argv[1]; assert not any(f.is_symlink() for f in p.rglob("*"))' "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/import-output"
          # Run as the runner user, not root: with every capability dropped,
          # CAP_DAC_OVERRIDE included, root could not write the runner-owned
          # output directory ("Permission denied: /output/candidate.json"), and
          # the untrusted spec expansion has no reason to run as uid 0 anyway.
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PACKAGE \
            -v "$PWD/tools:/trusted/tools:ro" \
            -v "$PWD/packages/$PACKAGE:/input/packages/$PACKAGE:ro" \
            -v "$RUNNER_TEMP/import-output:/output:rw" \
            -w /input \
            quay.io/packit/packit:latest@sha256:fca69807fd208e31990837dd4dac1bef4a7ed9f0698ae7124e9f78653930f0de bash -exc '
              python3 /trusted/tools/bootstrap_upstream_sources.py \
                --root /input --package "$PACKAGE" \
                --output /output/candidate.json --report /output/report.json
            '
          # Only these two JSON files cross the container boundary. Recipe
          # bytes are the untouched host-side dist-git import.
          test ! -L "$RUNNER_TEMP/import-output/candidate.json"
          test ! -L "$RUNNER_TEMP/import-output/report.json"
          mkdir -p proposal/packages
          cp -a "packages/$PACKAGE" proposal/packages/
          cp "$RUNNER_TEMP/import-output/candidate.json" proposal/candidate.json
          cp "$RUNNER_TEMP/import-output/report.json" proposal/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: import-proposal
          path: proposal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: import
    # App credentials are minted only on this organization's main branch.
    if: github.repository_owner == 'projectbluefin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # The workflow token only reads. The pull request is opened with the
    # mergeraptor App token below, as refresh-buildroot.yml does (#890), so
    # the normal pull_request checks run on its exact head and the hive
    # treats it as a trusted bot PR.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: import-proposal
          path: incoming
      - name: Restore only recipe data using trusted tools
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 -m pip install --quiet pytest==8.3.5 pyyaml==6.0.3
          python3 -m tools.import_proposal "$PACKAGE" incoming
      - name: Regenerate the Packit config
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 tools/render_packit_config.py --write
      - name: Run the same gates a contributor runs
        # A PR that cannot pass these is not opened. Runs the unit suite,
        # validate (which itself reports the new inventory size), and the
        # workflow-quoting check before peter-evans/create-pull-request.
        run: |
          python3 -m pytest tests -q
          python3 tools/validate.py
          python3 tools/check_workflow_quoting.py
      - name: Get repository-scoped mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          # No owner: scope to this repository; revoke the token at job completion.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open reviewable update
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          # App-authenticated writes trigger real PR CI, including Canary.
          token: ${{ steps.app-token.outputs.token }}
          branch: import/rawhide-${{ inputs.package }}
          delete-branch: true
          # Recipe, source lock, generated config, and diagnostic report.
          # Anything outside this list does not belong on the import branch.
          add-paths: |
            packages/${{ inputs.package }}/
            .packit.yaml
            config/upstream-sources.json
            reports/import-source-bootstrap.json
          title: 'import: Rawhide ${{ inputs.package }}'
          commit-message: 'import: Rawhide ${{ inputs.package }}'
          body: |
            Imports Fedora dist-git at the exact commit recorded in
            `packages/${{ inputs.package }}/.hummingbird-upstream.json`,
            writes the SHA-512 source lock via
            an isolated `bootstrap_upstream_sources.py` candidate accepted
            as data by the fresh proposal job’s trusted `import_proposal.py`, regenerates
            `.packit.yaml` via `tools/render_packit_config.py --write`, and passes
            `pytest`, `tools/validate.py` and
            `tools/check_workflow_quoting.py` before opening.

            Review and patch the snapshot here before enabling it in a rebuild set.
