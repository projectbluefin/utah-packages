name: Import Rawhide package

# Imports one Fedora dist-git recipe into this factory, then writes every
# artifact the recipe-set agreement gate (`tests/test_recipe_set_agreement.py`)
# checks for it, so the pull request is born green rather than needing a
# follow-up like #320.
#
# Four files must move together or the gate fails: the recipe directory
# (`tools/import_rawhide.py`), the SHA-512 source lock
# (`tools/bootstrap_upstream_sources.py --package <name> --merge`; runs inside
# the pinned `quay.io/packit/packit` image because it needs `rpmspec`), the
# regenerated `.packit.yaml` block (`tools/render_packit_config.py --write`),
# and the recipe counts in the four count tests plus `docs/architecture.md`
# (they used to be hardcoded literals; this workflow keeps them as
# data-driven assertions so adding or removing a recipe does not require a
# hand edit of every count).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Fedora dist-git package name to import
        required: true
        type: string
      branch:
        description: Upstream branch
        required: true
        default: rawhide
        type: string

permissions: {}

jobs:
  import:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The checkout's `.git/config` carries the GITHUB_TOKEN credential
          # inside the mounted workspace; an unreviewed rpmspec expansion
          # (an imported dist-git spec the next step just fetched) could read
          # it. Disable the credential helper so that path is closed; the
          # docker run itself only passes -e PACKAGE.
          persist-credentials: false
      - name: Install test dependencies
        # ubuntu-24.04 does not ship pytest / pyyaml; the gate step below
        # imports yaml (tests/test_packit_srpm.py) and runs the full unit
        # suite.
        run: |
          python3 -m pip install --quiet \
            pytest==8.3.5 \
            pyyaml==6.0.3
      - name: Import Fedora dist-git snapshot
        env:
          PACKAGE: ${{ inputs.package }}
          BRANCH: ${{ inputs.branch }}
        run: |
          python3 tools/import_rawhide.py \
            "$PACKAGE" \
            --branch "$BRANCH"
      - name: Lock the upstream source in isolation
        # Specs can execute macros. They see immutable tools/recipe data and
        # one disposable output directory, never host scripts or credentials.
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python3 -c 'import pathlib, sys; p = pathlib.Path("packages") / sys.argv[1]; assert not any(f.is_symlink() for f in p.rglob("*"))' "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/import-output"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            -e PACKAGE \
            -v "$PWD/tools:/trusted/tools:ro" \
            -v "$PWD/packages/$PACKAGE:/input/packages/$PACKAGE:ro" \
            -v "$RUNNER_TEMP/import-output:/output:rw" \
            -w /input \
            quay.io/packit/packit:latest@sha256:43e546e82850abc08bec850a46d69dba87fa77902f08dff8d5cc9ab1613f8c84 bash -exc '
              python3 /trusted/tools/bootstrap_upstream_sources.py \
                --root /input --package "$PACKAGE" \
                --output /output/candidate.json --report /output/report.json
            '
          # Only these two JSON files cross the container boundary. Recipe
          # bytes are the untouched host-side dist-git import.
          test ! -L "$RUNNER_TEMP/import-output/candidate.json"
          test ! -L "$RUNNER_TEMP/import-output/report.json"
          mkdir -p proposal/packages
          cp -a "packages/$PACKAGE" proposal/packages/
          cp "$RUNNER_TEMP/import-output/candidate.json" proposal/candidate.json
          cp "$RUNNER_TEMP/import-output/report.json" proposal/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-proposal
          path: proposal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: import
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: import-proposal
          path: incoming
      - name: Restore only recipe data using trusted tools
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 -m pip install --quiet pytest==8.3.5 pyyaml==6.0.3
          python3 -m tools.import_proposal "$PACKAGE" incoming
      - name: Regenerate the Packit config
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 tools/render_packit_config.py --write
      - name: Refresh the architecture.md inventory counts
        # tests/test_architecture_counts.py reads docs/architecture.md and
        # compares its numbers to the live inventory; an import that adds
        # a recipe makes that comparison fail unless the doc moves with it.
        run: |
          python3 tools/render_architecture_counts.py --write
      - name: Run the same gates a contributor runs
        # A PR that cannot pass these is not opened. Runs the unit suite,
        # validate (which itself reports the new inventory size), and the
        # workflow-quoting check before peter-evans/create-pull-request.
        run: |
          python3 -m pytest tests -q
          python3 tools/validate.py
          python3 tools/check_workflow_quoting.py
      - name: Open reviewable update
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: import/rawhide-${{ inputs.package }}
          delete-branch: true
          # The five files the agreement gate compares. Anything outside this
          # list does not belong on the import branch.
          add-paths: |
            packages/${{ inputs.package }}/
            .packit.yaml
            config/upstream-sources.json
            reports/import-source-bootstrap.json
            docs/architecture.md
          title: 'import: Rawhide ${{ inputs.package }}'
          commit-message: 'import: Rawhide ${{ inputs.package }}'
          body: |
            Imports Fedora dist-git at the exact commit recorded in
            `packages/${{ inputs.package }}/.hummingbird-upstream.json`,
            writes the SHA-512 source lock via
            an isolated `bootstrap_upstream_sources.py` candidate accepted
            as data by the fresh proposal job’s trusted `import_proposal.py`, regenerates
            `.packit.yaml` via `tools/render_packit_config.py --write`,
            refreshes the inventory counts in `docs/architecture.md` via
            `tools/render_architecture_counts.py --write`, and passes
            `pytest`, `tools/validate.py` and
            `tools/check_workflow_quoting.py` before opening.

            Review and patch the snapshot here before enabling it in a rebuild set.
      - name: Dispatch bot-pr-validate on the PR head (#378)
        # workflow_run cannot attach checks to GITHUB_TOKEN-opened bot PRs
        # because pull_requests[] is empty for schedule/workflow_dispatch
        # triggers. Dispatch bot-pr-validate explicitly so its check suite
        # attaches to the PR head (#377).
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          BRANCH: import/rawhide-${{ inputs.package }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run bot-pr-validate.yml -R "$REPOSITORY" \
            --ref "$BRANCH" -f pr="$PR"
          echo "dispatched bot-pr-validate for PR #$PR"
