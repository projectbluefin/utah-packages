name: Compose Hummingbird GitHub base

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Rebuild Rawhide RPMs]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: containers/base
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/utah-packages-base:rawhide
          build-args: |
            REPOSITORY_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            VERSION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.ref == 'refs/heads/main'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/utah-packages-base
          subject-digest: ${{ steps.build.outputs.digest }}
