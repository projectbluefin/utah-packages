name: Compose Hummingbird GitHub base

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Rebuild Rawhide RPMs]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: containers/base
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/utah-packages-base:rawhide
          build-args: |
            REPOSITORY_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            VERSION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.ref == 'refs/heads/main'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/utah-packages-base
          subject-digest: ${{ steps.build.outputs.digest }}
