name: Validate factory configuration

# merge_group: `Unit tests` and `Runtime contract` are required checks, and the
# merge queue waits for them on its own commit. Every job here is read-only
# (contents: read), so the queue runs them exactly as a pull request does.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory-contract:
    name: Factory onboarding contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/factory_contract.py

  validate:
    name: Package factory configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/validate.py

  multimedia-closure:
    name: Bluefin multimedia closure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/multimedia_closure.py --check
  workflow-quoting:
    name: Workflow build-script quoting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/check_workflow_quoting.py

  runtime-contract:
    name: Runtime contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --check

  factory-build-backlog:
    name: Factory build backlog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The catalog must account for every audited name under the pinned
      # digest, and no backlog recipe may lack a source lock.  The report
      # itself is derived and not committed: every import moves its totals,
      # so a tracked copy made concurrent import PRs conflict.  See #309.
      - run: python3 tools/factory_build_backlog.py --check
      - name: Publish the live backlog report
        run: |
          python3 tools/factory_build_backlog.py \
            --output "$RUNNER_TEMP/factory-build-backlog.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-build-backlog
          path: ${{ runner.temp }}/factory-build-backlog.json

  dakota-audit:
    name: Dakota element audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install --disable-pip-version-check pyyaml==6.0.3
      # The mapping in config/dakota.json must name exactly the snapshot's
      # elements, and every reviewer decision one of them.  Like the backlog,
      # the report is derived and not committed: every recipe import moves
      # it, so a tracked copy would go stale or conflict.  See #309.
      - run: python3 tools/audit_dakota.py --check
      - name: Publish the live Dakota audit report
        run: |
          python3 tools/audit_dakota.py \
            --json-out "$RUNNER_TEMP/dakota-audit/audit-dakota.json" \
            --markdown-out "$RUNNER_TEMP/dakota-audit/audit-dakota.md"
          cat "$RUNNER_TEMP/dakota-audit/audit-dakota.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dakota-audit
          path: ${{ runner.temp }}/dakota-audit/

  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install --disable-pip-version-check pytest==8.3.5 pyyaml==6.0.3 pytest-cov==7.0.0 coverage==7.16.2
      - name: Configure subprocess coverage
        run: printf '[run]\nparallel = true\ninclude = */tools/*.py\n[paths]\ntools =\n    tools\n    /tmp/*/tools\n' > .coveragerc
      - name: Unit tests with coverage
        env:
          # Child processes run from temporary directories: keep their data in
          # the workspace and arm coverage's startup hook with an absolute rc path.
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          python3 -m pytest tests -q \
            --cov=tools --cov-report=term-missing:skip-covered --cov-report=xml \
            --cov-precision=2 --cov-fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
