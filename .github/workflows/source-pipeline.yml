name: Verify upstream sources

on:
  workflow_dispatch:
    inputs:
      package:
        description: Direct-upstream package name; leave empty for all configured packages
        required: false
  schedule:
    - cron: '13 */2 * * *'

permissions:
  contents: read

# The periodic full-lock audit is a two-hour backstop; build and source-bump
# workflows also verify their inputs before use. Let slow upstream checks finish
# rather than cancel them on a newer invocation (#445). GitHub keeps at most one
# pending run per group, so letting the running one finish cannot pile runs up.
concurrency:
  group: source-pipeline
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # A hung run still ends, as a failure, instead of holding the queue.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch, verify, and report
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            python3 tools/source_pipeline.py "$PACKAGE"
          else
            python3 tools/source_pipeline.py
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: source-pipeline-report
          path: reports/source-pipeline
          if-no-files-found: ignore
