name: Bump upstream source locks

# Opens one reviewable PR when a source this factory tracks ships a newer
# release. Three feeds are polled, plus explicit per-lock feeds, covering
# 382 of the 402 locks (measured 2026-10-03):
#
#   download.gnome.org   67  cache.json per-module release index: 26 read
#                            off GNOME primaries, 41 from an explicit `feed`
#                            (gtk3's module is "gtk")
#   git forges          165  tags, or releases where a project publishes them:
#                            81 read off lock URLs, 84 from an explicit `feed`
#   release-monitoring  150  Anitya, for upstreams that publish only a
#                            directory listing (x.org, freedesktop.org,
#                            kernel.org, SourceForge); the project is the one
#                            Fedora's own package mapping names
#
# Every explicit feed was derived from the spec's Source0 and checked to list
# the locked version (issue #134).
#
# A lock whose primary is still the lookaside only ever yields a review-only
# proposal on the scheduled run: the new bytes are not in the lookaside until
# Fedora uploads them, and no unattended run moves a primary. Dispatching
# this workflow with `package` set relocks one such package onto the GNOME
# module or forge its explicit feed names (Anitya names no download, so never
# for those), retiring it from config/fedora-primary-sources.txt.
#
# The remaining 20 have no usable feed: git snapshots, Fedora-only or
# repacked sources, compat pins, and tag streams whose versions do not match
# the lock's spelling. They are listed in docs/skills/upstream-version-bumps.md.
#
# renovate.json has a custom manager aimed at config/upstream-sources.json,
# but it keys on datasource and depName and 0 of 340 entries carry either, so
# it has never matched. Renovate could not finish the job anyway: a version
# lives in three files here and only one of them is JSON, and the tarball's
# SHA-512 has to be computed from the bytes.
#
# GNOME cycle policy: the scheduled run stays inside each lock's own
# release cycle -- it takes GNOME 51 point releases but never jumps to 52.
# A newer GNOME cycle is reported for a human and never applied, and a cycle
# whose final has not shipped yet proposes nothing, so no run can land on an
# alpha, beta or rc. GNOME-next work happens on a next branch: cut it, then
# dispatch this workflow there with target-cycle set (e.g. 52). The override
# only widens the in-cycle window; prereleases stay unproposable.
#
# This workflow proposes; bump-upstream-gate.yml decides. Once the daily
# in-cycle pull request is opened or updated, the gate is dispatched: it
# builds exactly the bumped recipes through rebuild-rpms.yml, publishing
# nothing, and merges only when every one of them built, then dispatches the
# factory on main to publish latest. When only some bumped packages fail, the
# gate holds those in config/bump-holds.json at the failing version, drops
# them from the pull request and gates the rest again; this workflow then
# skips a held version until upstream ships a newer one or a human deletes
# the hold. Applying a newer release retires its hold, which is why the
# holds file is committed with the bump. Cross-cycle and major candidates
# are still only reported above, never applied, so they never reach the
# gate. A target-cycle run is never gated: GNOME-next merges stay human.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Limit the run to a single package (default: every lock with a release feed)"
        required: false
        type: string
      target-cycle:
        description: "Move within this release cycle instead of each lock's own (GNOME-next branches only)"
        required: false
        type: string
  schedule:
    # Away from the top of the hour, where scheduled jobs are commonly delayed.
    - cron: '41 6 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-source-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # gh workflow run: dispatch the gate. GITHUB_TOKEN-created pull requests
      # start no pull_request workflows; a dispatch does start one.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Report first, unconditionally, so the run's log says what was
      # considered even when nothing is written -- including the cross-cycle
      # candidates the tool refuses to apply on its own.
      # GITHUB_TOKEN is not optional for the forge feeds. Anonymous GitHub
      # allows 60 requests an hour and this factory locks 36 sources there, so
      # an unauthenticated run rate-limits part way down the list and reports
      # the remainder as unreachable -- which reads as "nothing to bump".
      - name: Report what upstream has released
        run: |
          python3 tools/upstream_bump.py ${PACKAGE:+--package "$PACKAGE"} ${CYCLE:+--cycle "$CYCLE"}
        env:
          PACKAGE: ${{ inputs.package }}
          CYCLE: ${{ inputs.target-cycle }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite the locks, specs and source manifests
        run: |
          python3 tools/upstream_bump.py --apply ${PACKAGE:+--package "$PACKAGE"} ${CYCLE:+--cycle "$CYCLE"}
        env:
          PACKAGE: ${{ inputs.package }}
          CYCLE: ${{ inputs.target-cycle }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same gates a contributor runs. A bump that cannot pass these is a
      # bump nobody should be asked to review.
      - name: Validate the result
        run: |
          python3 -m unittest discover -s tests -q
          python3 tools/validate.py
          python3 tools/check_workflow_quoting.py

      # Proves the rewritten locks actually resolve and that each recorded
      # SHA-512 matches the bytes upstream serves, rather than trusting the
      # digest this workflow just computed.
      - name: Re-verify every rewritten source against its new checksum
        run: |
          python3 tools/source_pipeline.py \
            --output work/sources \
            --report-dir work/reports

      - name: Open reviewable update
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A target-cycle run (GNOME-next branches) gets its own PR branch so
          # it never collides with the daily in-cycle PR.
          branch: ${{ inputs.target-cycle != '' && format('bump/upstream-sources-cycle-{0}', inputs.target-cycle) || 'bump/upstream-sources' }}
          delete-branch: true
          # Only the lock and the recipes. The verification steps above leave
          # source_pipeline.py reports in work/; without this the PR committed
          # dozens of work/reports/*.json files alongside the bumps.
          add-paths: |
            config/upstream-sources.json
            config/fedora-primary-sources.txt
            config/bump-holds.json
            packages/
          title: 'chore(sources): bump upstream locks to released versions'
          commit-message: 'chore(sources): bump upstream locks to released versions'
          body: |
            Opened by `.github/workflows/bump-upstream-sources.yml`.

            Each package below had its `Version:`, its `sources` manifest and
            its `config/upstream-sources.json` entry rewritten together, with
            the SHA-512 computed from the upstream bytes actually served. The
            run log lists what moved, and any candidate that crosses a release
            cycle or a major version is reported for a human and never applied,
            because version arithmetic alone cannot make that compatibility
            decision. A dispatched `target-cycle` run widens the window to the
            named cycle (GNOME-next branches); prereleases are never proposed
            with or without it.

            Verified in the run before this PR was opened: the unit tests,
            `tools/validate.py`, the workflow quoting check, and
            `tools/source_pipeline.py`, which re-downloads every rewritten
            source and rejects a digest that does not match.

            **The build is verified next**, by `bump-upstream-gate.yml`: it
            builds exactly the bumped recipes against the published factory,
            publishing nothing, and merges this pull request only if every
            one of them built and the head is still the commit it built. If
            some fail, it comments naming them, holds them in
            `config/bump-holds.json` at the failing version, drops them from
            this pull request and gates the rest again.

      # Every day the pull request is still open, including a day on which
      # nothing new moved (operation none): a gate that failed on a flaky
      # build gets another try, and one that already merged left nothing open.
      - name: Gate the update on its own build
        if: inputs.target-cycle == '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPOSITORY" --head bump/upstream-sources --base main \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "no open bump pull request; nothing to gate"
            exit 0
          fi
          gh workflow run bump-upstream-gate.yml -R "$REPOSITORY" \
            --ref bump/upstream-sources -f pr="$pr"
          echo "dispatched the bump gate for pull request $pr"
