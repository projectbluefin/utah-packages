name: Bump upstream source locks

# Opens one reviewable PR when a source this factory tracks ships a newer
# release. Three feeds are polled, covering 63 of the 340 locks:
#
#   download.gnome.org  17  cache.json per-module release index
#   github.com          36  tags, or releases where a project publishes them
#   gitlab (3 hosts)    10  repository tags API
#
# The remaining 277 are locked on Fedora's lookaside cache or on a bare
# directory listing. A lookaside URL carries its own digest in the path, so
# there is nothing to poll for "latest"; reaching those needs each project's
# real upstream feed identified per package, which is tracked separately.
#
# renovate.json has a custom manager aimed at config/upstream-sources.json,
# but it keys on datasource and depName and 0 of 340 entries carry either, so
# it has never matched. Renovate could not finish the job anyway: a version
# lives in three files here and only one of them is JSON, and the tarball's
# SHA-512 has to be computed from the bytes.
#
# Deliberately proposes, never merges. The bump changes what the factory
# builds, so it goes through the same review and the same eleven-stage run as
# any other recipe change.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Limit the run to a single package (default: every lock with a release feed)"
        required: false
        type: string
  schedule:
    # Away from the top of the hour, where scheduled jobs are commonly delayed.
    - cron: '41 6 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-source-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Report first, unconditionally, so the run's log says what was
      # considered even when nothing is written -- including the cross-cycle
      # candidates the tool refuses to apply on its own.
      # GITHUB_TOKEN is not optional for the forge feeds. Anonymous GitHub
      # allows 60 requests an hour and this factory locks 36 sources there, so
      # an unauthenticated run rate-limits part way down the list and reports
      # the remainder as unreachable -- which reads as "nothing to bump".
      - name: Report what upstream has released
        run: |
          python3 tools/upstream_bump.py ${PACKAGE:+--package "$PACKAGE"}
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite the locks, specs and source manifests
        run: |
          python3 tools/upstream_bump.py --apply ${PACKAGE:+--package "$PACKAGE"}
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same gates a contributor runs. A bump that cannot pass these is a
      # bump nobody should be asked to review.
      - name: Validate the result
        run: |
          python3 -m unittest discover -s tests -q
          python3 tools/validate.py
          python3 tools/check_workflow_quoting.py

      # Proves the rewritten locks actually resolve and that each recorded
      # SHA-512 matches the bytes upstream serves, rather than trusting the
      # digest this workflow just computed.
      - name: Re-verify every rewritten source against its new checksum
        run: |
          python3 tools/source_pipeline.py \
            --output work/sources \
            --report-dir work/reports

      - name: Open reviewable update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bump/upstream-sources
          delete-branch: true
          title: 'chore(sources): bump upstream locks to released versions'
          commit-message: 'chore(sources): bump upstream locks to released versions'
          body: |
            Opened by `.github/workflows/bump-upstream-sources.yml`.

            Each package below had its `Version:`, its `sources` manifest and
            its `config/upstream-sources.json` entry rewritten together, with
            the SHA-512 computed from the upstream bytes actually served. The
            run log lists what moved, and any candidate that crosses a release
            cycle or a major version is reported for a human and never applied,
            because version arithmetic alone cannot make that compatibility
            decision.

            Verified in the run before this PR was opened: the unit tests,
            `tools/validate.py`, the workflow quoting check, and
            `tools/source_pipeline.py`, which re-downloads every rewritten
            source and rejects a digest that does not match.

            **Not verified: the build.** A GNOME major bump usually needs spec
            patch refreshes, and this is a large rebuild. That is what this
            PR's own factory run is for.
