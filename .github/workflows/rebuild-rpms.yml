name: Build verified upstream RPMs

on:
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every package, ignoring what is already published
        required: false
        default: false
        type: boolean
      backend:
        description: >
          How to build. hermetic (the default) locks a mock root from real
          BuildRequires and builds offline from the lock, the way Hummingbird
          does; a package with build_lane container in
          config/upstream-sources.json stays on the container lane.
          container is the hand-simulated build root every package was built
          in before. mock is a plain networked mock root.
        required: false
        default: hermetic
        type: choice
        options:
          - hermetic
          - container
          - mock
  # A merge that changes a recipe or config builds it, plus everything that
  # BuildRequires it, and publishes -- the way Fedora and Hummingbird build a
  # package when it changes. Pipeline-only changes are proven by the canary
  # on their pull request instead, and reach the next scheduled run.
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'config/**'
  schedule:
    # Daily: whatever changed, plus a retry of every package whose last
    # attempt failed. It used to run at 06:41, the same minute as
    # bump-upstream-sources.yml; the bump now reaches the factory through the
    # push above when its pull request merges.
    - cron: '17 3 * * *'
    # Weekly safety net: every package, whatever the state label says.
    - cron: '23 1 * * 0'
  # The canary (.github/workflows/canary.yml) calls this same workflow, so a
  # pipeline change is proven on the real jobs in minutes, over a fixed
  # handful of packages, before any full run. Every input below defaults to
  # what a production run does; booleans are phrased negatively so that a
  # schedule or dispatch run, where they are null, reads as false.
  workflow_call:
    inputs:
      full:
        description: Rebuild every selected package, ignoring what is already published
        required: false
        default: false
        type: boolean
      backend:
        required: false
        default: hermetic
        type: string
      packages:
        description: JSON array restricting the inventory to these recipes
        required: false
        default: ''
        type: string
      publish_tag:
        description: >
          Tag to seed from and publish to instead of latest or the branch tag.
          The canary uses canary-<pr>; it never names latest.
        required: false
        default: ''
        type: string
      no_factory:
        description: Build without the published factory repository in the build root
        required: false
        default: false
        type: boolean
      skip_publish:
        description: Build, check precedence, and stop before publish
        required: false
        default: false
        type: boolean
      consumer:
        description: >
          What the Hummingbird-only transaction installs. contract (default)
          is the runtime contract; built is every binary RPM in the candidate
          repository, for a canary set too small to satisfy the contract.
        required: false
        default: contract
        type: string
      artifact_prefix:
        required: false
        default: ''
        type: string
      cache_salt:
        required: false
        default: ''
        type: string
      perturb:
        required: false
        default: ''
        type: string
      flaky_check:
        description: >
          Canary only: JSON names whose %check fails once and passes on the
          retry, to prove build-stage.yml retries a flaky %check.
        required: false
        default: ''
        type: string
      factory_tag:
        description: >
          Read this tag as the published factory instead of latest or the
          branch tag. The canary points it at its own tag to exercise
          incremental selection against a state it published itself.
        required: false
        default: ''
        type: string
      inject_failure:
        description: >
          Canary only: JSON names whose build job fails on purpose, to prove
          a failed package keeps its previous build and is reported.
        required: false
        default: ''
        type: string
    outputs:
      build_list:
        description: JSON names prepare selected
        value: ${{ jobs.prepare.outputs.build_list }}
      ref:
        description: The published tag
        value: ${{ jobs.publish.outputs.ref }}
      digest:
        description: The published digest
        value: ${{ jobs.publish.outputs.digest }}
      failed:
        description: JSON names of the selected packages that did not publish
        value: ${{ jobs.report.outputs.failed }}
      utah_report:
        description: JSON verdict of resolving what Utah installs against the candidate
        value: ${{ jobs.publish.outputs.utah_report }}

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

# One run per ref at a time, and a merge never cancels one in flight: each
# run's builds finish and publish. GitHub keeps at most one run pending
# behind it and replaces an older pending run with a newer one; nothing is
# lost by that, because prepare selects against the state label on the
# published image -- every change since the last publication -- not against
# the previous push. The canary's passes each have their own prefix, so they
# are not serialized behind main or one another.
#
# Publication stays serialized below as well, and publish still refuses to
# replace an image that advanced while the run was building.
concurrency:
  group: rebuild-rpms-${{ github.ref }}-${{ inputs.artifact_prefix || 'factory' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
      # The build root this factory uses is pinned in config/buildroot-image
      # (read by tools/buildroot_pin.py in the "Pull the build root" step).
      # History of why it is pinned the way it is:
      #
      # It is the EXPECTED value, not the pull target. quay.io/fedora/fedora:44
      # is republished several times a day and each previous digest is
      # garbage-collected, so a digest here is dead within hours: 3a6e77a
      # pinned a58a82ed on 09-12, it was 404 by 09-17; the replacement
      # 61beafd3, resolved and verified 200 at 03:50 on 09-17, was 404 by
      # 07:13 the same morning. Fedora publishes no immutable tag -- only 44
      # and its per-arch variants -- so there is nothing stable to pin to.
      #
      # Pulling by that digest is what broke run 35186196830: stages 0 to 3
      # pulled it at 06:01 and stages 4 to 10 got
      #   manifest for quay.io/fedora/fedora@sha256:61beafd3... not found
      # thirty-seven jobs dead on exit 125, mid-run, from a pin that had been
      # correct when the run started. So the tag is pulled once here and the
      # bytes are shared with every job; a mismatch against this digest is
      # reported, not fatal, because failing on it recreates that outage.
      #
      # That still left the root moving under the factory several times a
      # day, and the package cache key includes its digest, so every late
      # stage missed (webkitgtk built cold twice, 2cdfedd -> 94e175d). The
      # factory now owns the root: refresh-buildroot.yml copies fedora:44 to
      # ghcr.io/projectbluefin/utah-buildroot weekly under a dated tag, which
      # nothing prunes, and opens a PR moving this pin
      # (tools/buildroot_pin.py). The pin lives in config/buildroot-image, not
      # here: the workflow token may not edit workflow files, so a pin in this
      # file could never be moved by the refresh job (run 36167595383).
      # A mirror pin is pulled by digest and a failure is fatal: that digest
      # cannot rot. A quay.io value is the legacy form and keeps the old
      # pull-the-tag-and-warn behaviour.
    outputs:
      buildroot_digest: ${{ steps.buildroot.outputs.digest }}
      factory_image: ${{ steps.factory_image.outputs.image }}
      seed_image: ${{ steps.factory_image.outputs.seed }}
      stage0: ${{ steps.matrix.outputs.stage0 }}
      stage1: ${{ steps.matrix.outputs.stage1 }}
      stage2: ${{ steps.matrix.outputs.stage2 }}
      stage3: ${{ steps.matrix.outputs.stage3 }}
      stage4: ${{ steps.matrix.outputs.stage4 }}
      stage0_chunks: ${{ steps.matrix.outputs.stage0_chunks }}
      stage1_chunks: ${{ steps.matrix.outputs.stage1_chunks }}
      stage2_chunks: ${{ steps.matrix.outputs.stage2_chunks }}
      stage3_chunks: ${{ steps.matrix.outputs.stage3_chunks }}
      stage4_chunks: ${{ steps.matrix.outputs.stage4_chunks }}
      stage5: ${{ steps.matrix.outputs.stage5 }}
      stage6: ${{ steps.matrix.outputs.stage6 }}
      stage7: ${{ steps.matrix.outputs.stage7 }}
      stage8: ${{ steps.matrix.outputs.stage8 }}
      stage9: ${{ steps.matrix.outputs.stage9 }}
      stage10: ${{ steps.matrix.outputs.stage10 }}
      stage5_chunks: ${{ steps.matrix.outputs.stage5_chunks }}
      stage6_chunks: ${{ steps.matrix.outputs.stage6_chunks }}
      stage7_chunks: ${{ steps.matrix.outputs.stage7_chunks }}
      stage8_chunks: ${{ steps.matrix.outputs.stage8_chunks }}
      stage9_chunks: ${{ steps.matrix.outputs.stage9_chunks }}
      stage10_chunks: ${{ steps.matrix.outputs.stage10_chunks }}
      stage11: ${{ steps.matrix.outputs.stage11 }}
      stage11_chunks: ${{ steps.matrix.outputs.stage11_chunks }}
      stage12: ${{ steps.matrix.outputs.stage12 }}
      stage12_chunks: ${{ steps.matrix.outputs.stage12_chunks }}
      stage13: ${{ steps.matrix.outputs.stage13 }}
      stage13_chunks: ${{ steps.matrix.outputs.stage13_chunks }}
      build_list: ${{ steps.matrix.outputs.build_list }}
      cacheable: ${{ steps.matrix.outputs.cacheable }}
      prune_sources: ${{ steps.matrix.outputs.prune_sources }}
      trusted: ${{ steps.matrix.outputs.trusted }}
      early_waves: ${{ steps.matrix.outputs.early_waves }}
      through0: ${{ steps.matrix.outputs.through0 }}
      through1: ${{ steps.matrix.outputs.through1 }}
      through2: ${{ steps.matrix.outputs.through2 }}
      through3: ${{ steps.matrix.outputs.through3 }}
      container_lane: ${{ steps.matrix.outputs.container_lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The same perturbation build-stage.yml applies, so the plan sees the
      # recipe the build jobs will build.
      - name: Perturb recipes for the canary
        if: inputs.perturb != ''
        env:
          PERTURB: ${{ inputs.perturb }}
        run: |
          for name in $(jq -r '.[]' <<<"$PERTURB"); do
            spec=$(find "packages/$name" -maxdepth 1 -name '*.spec' -print -quit)
            test -n "$spec"
            printf '\n# canary perturbation %s\n' "$GITHUB_RUN_ID" >> "$spec"
            echo "perturbed $spec"
          done
      - name: Validate factory policy and tests
        run: |
          python3 tools/check_workflow_quoting.py
          python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --check
          python3 -m unittest discover -s tests -v
      - name: Install zstandard
        run: pip install --disable-pip-version-check --quiet 'zstandard==0.25.0'
      # Pulled once for the whole run, then handed to every job as an
      # artifact. Two things this fixes that a digest pin cannot: the image
      # cannot rot between the pin being written and the run starting, and it
      # cannot rot between one stage and the next -- every job provably uses
      # the same bytes, which is a stronger reproducibility claim than the pin
      # made. It also replaces roughly three hundred registry pulls with one.
      - name: Pull the build root once and record what it resolved to
        id: buildroot
        run: |
          BUILDROOT_IMAGE=$(python3 tools/buildroot_pin.py get)
          tag="${BUILDROOT_IMAGE%@*}"
          expected="${BUILDROOT_IMAGE##*@}"
          case "$BUILDROOT_IMAGE" in
            ghcr.io/projectbluefin/utah-buildroot:*@sha256:*)
              # The factory mirror: immutable and never pruned, so pull the
              # exact pinned bytes and fail if they are not there.
              docker pull "${tag%:*}@${expected}"
              docker tag "${tag%:*}@${expected}" "$tag"
              actual="$expected"
              ;;
            *)
              docker pull "$tag"
              actual=$(docker image inspect "$tag" \
                --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
              if [ "$actual" != "$expected" ]; then
                echo "::warning title=build root moved::$tag now resolves to $actual, not the recorded $expected. The run continues on what it resolved to; run refresh-buildroot.yml to pin the factory mirror." >&2
              fi
              ;;
          esac
          echo "expected $expected"
          echo "actual   $actual"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
          # A bare name, deliberately. Every job runs this image by that name
          # with no registry behind it, so a job that failed to load the
          # artifact cannot silently fall back to pulling something else --
          # docker refuses an unqualified name it does not have locally.
          docker tag "$tag" utah-buildroot:run
          docker save utah-buildroot:run | zstd -T0 -3 -o buildroot.tar.zst
          ls -l buildroot.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}buildroot-image
          path: buildroot.tar.zst
          if-no-files-found: error
          retention-days: 1
      # The waves and the reverse dependencies an incremental run drags along
      # come from real BuildRequires: rpmspec, in this build root, over every
      # recipe (tools/build_graph.py). This used to be discarded: preflight
      # resolved BuildRequires and then left the waves to a hand-assigned
      # stage integer, two of which were discovered by a build failing.
      - name: Extract BuildRequires from every recipe
        run: |
          mkdir -p work/graph/rows
          docker run --rm \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/work/graph/rows:/out:Z" \
            -v "$PWD/tools/extract_buildrequires.sh:/extract.sh:ro,Z" \
            utah-buildroot:run bash /extract.sh
          sudo chown -R "$(id -u):$(id -g)" work/graph
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}build-graph
          path: work/graph
          retention-days: 7
      # The published repository is the witness for what may be skipped, and
      # it lives in one place: the OCI image publish writes. It used to be
      # read over HTTP from a GitHub Pages mirror that had been retired but
      # never taken down, frozen at 67 packages from before the 343-recipe
      # contract. Every run therefore skipped 7 and rebuilt 333, whatever had
      # changed -- eight hours for a one-line spec fix, and webkitgtk alone
      # five of them, on the serial path, with no change to its recipe.
      #
      # Resolved once here to a digest, like the build root, so every job in
      # the run reads the same repository even if publish moves the tag while
      # the run is in flight. A branch reads its own image first, so a second
      # push to a pull request skips what the first push built; main only ever
      # reads latest. No image at all is not an error: it means nothing can
      # be skipped, which is what rebuild_plan.py does with an empty witness.
      #
      # The seed is what publish will start from and must still find
      # unchanged (repeated mistake 14). It is the factory image itself
      # unless the canary names its own publish tag, whose previous image is
      # then the only thing it may seed from -- never latest.
      - name: Resolve the published factory image
        id: factory_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          NO_FACTORY: ${{ inputs.no_factory == true && '1' || '' }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          FACTORY_TAG: ${{ inputs.factory_tag }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages"
          branch=$(printf '%s' "$REF_NAME" \
            | tr "/" "-" | tr -cd "[:alnum:]._-" | cut -c1-96)
          if [ "$REF" = "refs/heads/main" ]; then
            candidates="latest"
          else
            candidates="$branch latest"
          fi
          if [ -n "$FACTORY_TAG" ]; then
            candidates="$FACTORY_TAG"
          fi
          if [ -n "$NO_FACTORY" ]; then
            candidates=
          fi
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "$ACTOR" --password-stdin \
            || echo "::warning title=ghcr login failed::resolving the factory image anonymously"
          # A tag, or a digest (sha256:...) -- the canary pins one run's
          # published image by digest so another pass cannot move it.
          resolve() {
            for tag in "$@"; do
              case "$tag" in
                sha256:*) ref="${image}@${tag}" ;;
                *) ref="${image}:${tag}" ;;
              esac
              if docker pull --quiet "$ref" >&2; then
                digest=$(docker image inspect "$ref" \
                  --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
                echo "$ref -> ${image}@${digest}" >&2
                echo "${image}@${digest}"
                return
              fi
              echo "no image at $ref" >&2
            done
          }
          # shellcheck disable=SC2086 # candidates is a word list
          resolved=$(resolve $candidates)
          if [ -z "$resolved" ] && [ -z "$NO_FACTORY" ]; then
            echo "::warning title=no factory image::nothing is published for this ref or main, so nothing can be skipped as already built"
          fi
          if [ -n "$PUBLISH_TAG" ]; then
            test "$PUBLISH_TAG" != latest
            seed=$(resolve "$PUBLISH_TAG")
          else
            seed="$resolved"
          fi
          echo "factory repository: ${resolved:-<none>}"
          echo "publish seed:       ${seed:-<none>}"
          echo "image=${resolved}" >> "$GITHUB_OUTPUT"
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          # The state label (tools/factory_state.py) is what prepare selects
          # against: the inputs every published build was made from.
          mkdir -p work
          if [ -n "$resolved" ]; then
            docker image inspect "$resolved" --format '{{json .Config.Labels}}' > work/factory-labels.json
          else
            echo null > work/factory-labels.json
          fi
      - uses: ./.github/actions/load-factory-repo
        id: factory
        with:
          image: ${{ steps.factory_image.outputs.image }}
      - id: matrix
        env:
          FULL: ${{ (inputs.full == true || github.event.schedule == '23 1 * * 0') && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          FACTORY_LABELS: work/factory-labels.json
          GRAPH_ROWS: work/graph/rows
          # Only a push has a range worth diffing. A pull_request event also
          # carries `before` -- the previous head of the branch, which a force
          # push makes unreachable, and git diff then kills prepare.
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          ONLY_PACKAGES: ${{ inputs.packages }}
          FACTORY_URL: ${{ steps.factory.outputs.url }}
        run: |
          # The action reports the path as the build container sees it under
          # /work; this step runs on the host, so read the same directory
          # from the workspace. Same bytes, and the only witness there is.
          if [ -n "$FACTORY_URL" ]; then
            export FACTORY_REPO="file://$PWD/work/factory"
          else
            export FACTORY_REPO=
          fi
          python3 tools/rebuild_matrix.py

  preflight:
    # Every missing platform dependency has so far been found the slow way: a
    # stage fails, we read one "No match for argument" line, add one package,
    # and wait another half hour for the next one. gtk4 needed pango >= 1.58.0
    # that Fedora 44 does not carry. This job resolves every recipe's
    # BuildRequires in the real build root up front, so one run enumerates all
    # of the gaps instead of one per round.
    #
    # It never gates a build. A requirement listed here may be perfectly fine:
    # a later-stage package legitimately BuildRequires something an earlier
    # stage has not built yet, and that is indistinguishable from a real gap
    # without resolving against the staged output. Read it as a worklist.
    needs: prepare
    if: needs.prepare.outputs.build_list != '[]'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/load-buildroot
        with:
          artifact: ${{ inputs.artifact_prefix }}buildroot-image
      - uses: ./.github/actions/load-factory-repo
        id: factory
        with:
          image: ${{ needs.prepare.outputs.factory_image }}
      - name: Resolve BuildRequires for packages being built
        env:
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
          BUILD_LIST: ${{ needs.prepare.outputs.build_list }}
        run: |
          mkdir -p work/reports
          docker run --rm \
            -e FACTORY_REPO -e BUILD_LIST \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            utah-buildroot:run bash -exc '
              disable=--disablerepo=fedora-cisco-openh264
              # The Fedora container images set tsflags=nodocs, so every %doc file is
              # dropped at install time. rand_core ships its crate docs that way and
              # its lib.rs does #![doc = include_str!("../README.md")], so rust-just
              # failed to compile: rustc could not read ../README.md. Nothing was wrong
              # with the Fedora package: mock installs docs into a build root, and
              # this container was not. Restore that.
              sed -i "/^tsflags=nodocs/d" /etc/dnf/dnf.conf
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              if [ -n "${FACTORY_REPO:-}" ]; then
                printf "[factory]\nname=factory\nbaseurl=%s\nenabled=1\ngpgcheck=0\npriority=5\n" \
                  "$FACTORY_REPO" > /etc/yum.repos.d/factory.repo
              fi
              dnf -y $disable install dnf-plugins-core rpm-build @buildsys-build
              rpm -q --qf "buildroot openssl: %{VERSION}-%{RELEASE}\n" openssl-libs || true
              : > /work/reports/preflight.txt
              # Only resolve BuildRequires for packages this run will actually
              # build (the incremental matrix), not the whole tree.
              # BUILD_LIST is a JSON array; strip brackets, quotes and commas
              # without ever writing a literal quote character.
              for package in $(echo "$BUILD_LIST" | sed -e s/\\[// -e s/\\]// -e s/\\\"//g -e s/,/ /g); do
                dir="/packages/$package"
                test -d "$dir" || { echo "build_list names missing dir: $dir" >> /work/reports/preflight.txt; continue; }
                spec=$(find "$dir" -maxdepth 1 -name "*.spec" -print -quit)
                test -n "$spec" || continue
                # --assumeno resolves the transaction without installing it,
                # but it also *declines* the transaction, so dnf exits non-zero
                # even when resolution succeeded. Keying off the exit status
                # listed all 70 recipes as failures and buried the real ones.
                # Judge by the error text instead.
                output=$(dnf $disable --assumeno builddep -D "_sourcedir $dir" "$spec" 2>&1 || true)
                # Two classes, and they are not equally trustworthy.
                #
                # "No match for argument" means a capability nothing in the root
                # provides. That has been reliable: it is how the real pango gap
                # was found.
                #
                # "cannot install both" is a version conflict between the layered
                # repositories and what @System already carries, and it has been
                # not a reliable predictor: packages have built successfully after
                # reporting one here. The resolution
                # this job performs is not the one the build performs, so conflicts
                # are recorded separately and must not be treated as gaps.
                missing=$(printf "%s\n" "$output" \
                  | grep -E "No match for argument|nothing provides" || true)
                conflict=$(printf "%s\n" "$output" | grep -E "cannot install" || true)
                if [ -n "$missing" ] || [ -n "$conflict" ]; then
                  printf "%s\n" "$package" >> /work/reports/preflight.txt
                  if [ -n "$missing" ]; then
                    printf "%s\n" "$missing" | sed "s/^/    MISSING  /" >> /work/reports/preflight.txt
                  fi
                  if [ -n "$conflict" ]; then
                    printf "%s\n" "$conflict" | sed "s/^/    conflict(unreliable)  /" >> /work/reports/preflight.txt
                  fi
                fi
              done
              echo "=== recipes with unresolved BuildRequires ==="
              cat /work/reports/preflight.txt
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}preflight-buildrequires
          path: work/reports/preflight.txt
          if-no-files-found: warn

  # Fourteen waves of the same build, ordered so a package can resolve a
  # BuildRequires against something an earlier wave produced. The wave
  # itself lives in build-stage.yml; only the ordering is here.
  #
  # GitHub needs the chain to be static, so the count is fixed at fourteen:
  # the deepest BuildRequires chain tools/build_graph.py solves is twelve
  # (hwdata -> libdisplay-info -> mesa -> ... -> nautilus-python). A
  # fifteenth wave is a real decision, not a silent overflow: `prepare` fails
  # rather than dropping a package that does not fit.
  rebuild0:
    needs: prepare
    if: needs.prepare.outputs.stage0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage0_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '0'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'hermetic' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      cache_salt: ${{ inputs.cache_salt }}
      perturb: ${{ inputs.perturb }}
      inject_failure: ${{ inputs.inject_failure }}
      flaky_check: ${{ inputs.flaky_check }}
      container_packages: ${{ needs.prepare.outputs.container_lane }}

  rebuild1:
    needs: [prepare, rebuild0]
    if: ${{ !cancelled() && needs.prepare.outputs.stage1 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage1_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '1'
      packages: ${{ matrix.chunk }}
