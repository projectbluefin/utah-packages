  report:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7, rebuild8, rebuild9, rebuild10, rebuild11, rebuild12, rebuild13, publish]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.build_list != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      failed: ${{ steps.name.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Name every package that did not publish
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_LIST: ${{ needs.prepare.outputs.build_list }}
          LOSERS: ${{ needs.publish.outputs.losers || '[]' }}
          PREFIX: ${{ inputs.artifact_prefix }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REPORT: ${{ needs.publish.outputs.report }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | jq -R . | jq -s . > artifacts.json
          python3 tools/publish_gate.py report \
            --build-list "$BUILD_LIST" --artifacts artifacts.json --prefix "$PREFIX" \
            --losers "$LOSERS" --publish-result "$PUBLISH_RESULT" \
            --publish-report "$PUBLISH_REPORT" --digest "$DIGEST" --run-url "$RUN_URL" \
            --output report.md --failed-output failed.json > /dev/null
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$(jq -c . failed.json)" >> "$GITHUB_OUTPUT"
          for name in $(jq -r '.[]' failed.json); do
            echo "::error title=package not published::$name failed this run and was not replaced"
          done
      # One issue per package Utah cannot install from the published
      # repository, opened when it appears and closed by the first run in
      # which it resolves. Only when the check actually ran.
      - name: Track each package Utah cannot install
        if: github.ref == 'refs/heads/main' && inputs.publish_tag == '' && inputs.artifact_prefix == '' && needs.publish.outputs.utah_report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UTAH_REPORT: ${{ needs.publish.outputs.utah_report }}
        run: |
          set -euo pipefail
          prefix="Utah install set: "
          gh issue list -R "$REPOSITORY" --state open --limit 200 \
            --search "in:title \"$prefix\"" --json number,title > open.json
          jq -r '.unresolved | keys[]' <<<"$UTAH_REPORT" > unresolved.txt
          while read -r package; do
            [ -n "$package" ] || continue
            title="${prefix}${package} does not resolve"
            why=$(jq -r --arg p "$package" '.unresolved[$p]' <<<"$UTAH_REPORT")
            fence='```'
            body=$(printf "Utah installs %s (projectbluefin/utah packages/*.toml), and it does not resolve against the published factory repository plus Hummingbird:\n\n%s\n%s\n%s\n\nLast seen: %s\n\nThis issue closes itself on the first run in which it resolves.\n" "$package" "$fence" "$why" "$fence" "$RUN_URL")
            number=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' open.json | head -n1)
            if [ -z "$number" ]; then
              gh issue create -R "$REPOSITORY" --title "$title" --body "$body"
            else
              gh issue edit "$number" -R "$REPOSITORY" --body "$body"
            fi
          done < unresolved.txt
          jq -r --arg prefix "$prefix" '.[] | select(.title | startswith($prefix)) | "\(.number)\t\(.title)"' open.json \
            | while IFS=$'\t' read -r number title; do
                package=${title#"$prefix"}
                package=${package% does not resolve}
                if ! grep -qxF "$package" unresolved.txt; then
                  gh issue close "$number" -R "$REPOSITORY" --comment "Resolves as of $RUN_URL."
                fi
              done
      - name: Open, update or close the tracking issue
        # Production runs only. A canary pass leaves publish_tag empty when
        # it does not publish, and a canary dispatched on main runs with
        # refs/heads/main, so the artifact prefix -- which every canary pass
        # sets and no production run does -- is what tells them apart.
        if: github.ref == 'refs/heads/main' && inputs.publish_tag == '' && inputs.artifact_prefix == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          title="Factory: packages failing on main"
          number=$(gh issue list -R "$REPOSITORY" --state open --limit 50 \
            --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          healthy=false
          if [ "$(jq length failed.json)" -eq 0 ] && [ "$PUBLISH_RESULT" != failure ]; then
            healthy=true
          fi
          if [ "$healthy" = true ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPOSITORY" --comment "Fixed: $RUN_URL built every selected package and published."
            fi
            exit 0
          fi
          if [ -z "$number" ]; then
            gh issue create -R "$REPOSITORY" --title "$title" --body-file report.md
            exit 0
          fi
          gh issue view "$number" -R "$REPOSITORY" --json body --jq .body > previous.md
          previous=$(python3 tools/publish_gate.py marker previous.md)
          gh issue edit "$number" -R "$REPOSITORY" --body-file report.md
          if [ "$previous" != "$(jq -c . failed.json)" ]; then
            gh issue comment "$number" -R "$REPOSITORY" --body-file report.md
          fi
