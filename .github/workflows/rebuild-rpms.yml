  # Each wave's successes publish as that wave finishes, while later waves
  # still build: publish0..publish3, one per wave among the first four that
  # has later waves still to come (see publish-repository.yml). Four, not
  # one per wave: the canary expands this workflow six times, and GitHub
  # refused a workflow with thirteen early publications per expansion
  # ("Maximum object size exceeded"). The first four waves of a run are
  # where a small change and its direct dependents live; anything later is
  # covered by the final publication. They run one after another, and
  # each seeds from the image the previous one pushed -- allowed because it
  # carries this run's id.
  publish0:
    needs: [prepare, rebuild0]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.skip_publish != true && contains(fromJSON(needs.prepare.outputs.early_waves), '0') }}
    uses: ./.github/workflows/publish-repository.yml
    with:
      wave: '0'
      final: false
      build_list: ${{ needs.prepare.outputs.through0 }}
