name: Build verified upstream RPMs

on:
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every package, ignoring what is already published
        required: false
        default: false
        type: boolean
      packages:
        description: Optional comma-separated package names to rebuild only
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - config/**
      - packages/**
      - tools/source_pipeline.py
      - tools/build_identity.py
      - tools/build_manifest.py
      - tools/runtime_contract.py
      - tests/**
      - .github/workflows/rebuild-rpms.yml
      - .github/workflows/rebuild-lane.yml
      - .github/workflows/checkpoint.yml
  pull_request:
    paths:
      - config/**
      - packages/**
      - tools/source_pipeline.py
      - tools/build_identity.py
      - tools/build_manifest.py
      - tools/runtime_contract.py
      - tests/**
      - .github/workflows/rebuild-rpms.yml
      - .github/workflows/rebuild-lane.yml
      - .github/workflows/checkpoint.yml
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read
  id-token: write
  packages: write
  pages: write

# Do not cancel an active WebKitGTK/mozjs/Mesa build when a newer commit lands.
# Queue one factory run per PR or branch instead; its checkpoints and exact
# package identities let the queued run reuse completed work rather than
# launching a duplicate multi-hour matrix.
concurrency:
  # A selected-package recovery run may proceed beside the normal PR run;
  # package-level concurrency still prevents two copies of the same lane/package.
  group: utah-packages-factory-${{ github.event.pull_request.number || github.ref }}-${{ inputs.packages != '' && 'recovery' || 'normal' }}
  cancel-in-progress: false

# Build waves may run concurrently.  They use run-scoped artifacts and each
# publication re-seeds from the then-current repository, so concurrent work
# cannot lose RPMs.  The consumer tag itself remains serialized at `publish`.

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      stage0: ${{ steps.matrix.outputs.stage0 }}
      stage1: ${{ steps.matrix.outputs.stage1 }}
      stage2: ${{ steps.matrix.outputs.stage2 }}
      stage3: ${{ steps.matrix.outputs.stage3 }}
      stage4: ${{ steps.matrix.outputs.stage4 }}
      stage0_late: ${{ steps.matrix.outputs.stage0_late }}
      stage1_heavy: ${{ steps.matrix.outputs.stage1_heavy }}
      stage2_late: ${{ steps.matrix.outputs.stage2_late }}
      stage3_late: ${{ steps.matrix.outputs.stage3_late }}
      build_list: ${{ steps.matrix.outputs.build_list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate factory policy and tests
        run: |
          python3 tools/check_workflow_quoting.py
          python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --check
          python3 -m unittest discover -s tests -v
      - name: Install zstandard
        run: pip install --quiet zstandard
      - name: Seed skip-list from the building accumulator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          mkdir -p /tmp/accumulator
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
          for image in "ghcr.io/${owner}/utah-packages:building" "ghcr.io/${owner}/utah-packages:latest"; do
            if podman pull "$image" 2>/dev/null; then
              container=$(podman create "$image")
              podman cp "$container:/repository/." /tmp/accumulator/ || true
              podman rm "$container"
              echo "seeded from $image"
              break
            fi
          done
          # Serve the local accumulator for FACTORY_REPO later in this run.
          # The prepare job is only computing the matrix here; the actual
          # serving happens via the FACTORY_REPO default below.
      - id: matrix
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true && '1' || '0' }}
          SELECTED_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || '' }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.request, gzip, io, sys, tomllib
          from pathlib import Path
          from tools.build_identity import identity

          config = json.loads(Path('config/upstream-sources.json').read_text())
          full = os.environ.get('FULL') == '1'
          selected_raw = os.environ.get('SELECTED_PACKAGES', '')
          selected = {item.strip() for item in selected_raw.split(',') if item.strip()}
          known = {item['name'] for item in config['packages']}
          unknown = selected - known
          if unknown:
              raise SystemExit(f"unknown selected packages: {', '.join(sorted(unknown))}")
          changed = set()
          base = os.environ.get('BASE_SHA', '')
          if not full and re.fullmatch(r'[0-9a-f]{40}', base or '') and set(base) != {'0'}:
              paths = subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}..HEAD'], text=True).splitlines()
              changed = {
                  match.group(1)
                  for path in paths
                  if (match := re.match(r'^packages/([^/]+)/', path))
              }
              print(f"changed package recipes: {', '.join(sorted(changed)) or 'none'}")

          # Read the currently built set so we only rebuild what is new or
          # changed. Prefer the local :building accumulator seeded above (it
          # carries every success across waves, including waves that never
          # reached `publish`); fall back to the published Pages repo. Version
          # matching alone is unsafe: a recipe, source lock, factory policy, or
          # Hummingbird base can change without changing Version. Check the
          # exact build identity when a checkpoint manifest is available.
          published = {}
          published_keys = {}
          published_outputs = {}
          accumulator_root = None

          def harvest(primary_bytes):
              for m in re.finditer(rb'<package[^>]*>.*?<name>([^<]+)</name>.*?<version[^>]*ver="([^"]+)"', primary_bytes, re.S):
                  published[m.group(1).decode()] = m.group(2).decode()

          def read_local_repo(root):
              global accumulator_root
              manifest = Path(root) / 'factory-build-manifest.json'
              if manifest.is_file():
                  try:
                      data = json.loads(manifest.read_text())
                      for name, value in data.get('packages', {}).items():
                          if not isinstance(value, dict) or not isinstance(value.get('build_key'), str):
                              continue
                          published_keys[name] = value['build_key']
                          published_outputs[name] = value.get('outputs', [])
                  except (OSError, ValueError, TypeError, AttributeError):
                      print('WARNING: ignoring invalid factory build manifest', file=sys.stderr)
              repomd = Path(root) / "repodata" / "repomd.xml"
              if not repomd.is_file():
                  return False
              href = re.search(r'<location href="([^"]*primary[^"]*)"', repomd.read_text()).group(1)
              raw = (Path(root) / href).read_bytes()
              if href.endswith('.zst'):
                  import zstandard
                  harvest(zstandard.ZstdDecompressor().stream_reader(io.BytesIO(raw)).read())
              else:
                  harvest(gzip.GzipFile(fileobj=io.BytesIO(raw)).read())
              accumulator_root = Path(root)
              return True

          def outputs_match(name):
              records = published_outputs.get(name, [])
              if not records or accumulator_root is None:
                  return False
              for record in records:
                  if not isinstance(record, dict) or not isinstance(record.get('file'), str) or not isinstance(record.get('sha256'), str):
                      return False
                  candidates = list(accumulator_root.rglob(Path(record['file']).name))
                  if not any(
                      candidate.is_file()
                      and hashlib.sha256(candidate.read_bytes()).hexdigest() == record['sha256']
                      for candidate in candidates
                  ):
                      return False
              return True

          if not full:
              try:
                  if read_local_repo("/tmp/accumulator"):
                      print(f"accumulator has {len(published)} packages")
                  else:
                      base = "https://projectbluefin.github.io/utah-packages/"
                      repomd = urllib.request.urlopen(base + "repodata/repomd.xml", timeout=60).read().decode()
                      href = re.search(r'<location href="([^"]*primary[^"]*)"', repomd).group(1)
                      raw = urllib.request.urlopen(base + href, timeout=120).read()
                      if href.endswith('.zst'):
                          import zstandard
                          harvest(zstandard.ZstdDecompressor().stream_reader(io.BytesIO(raw)).read())
                      else:
                          harvest(gzip.GzipFile(fileobj=io.BytesIO(raw)).read())
                      print(f"published repo has {len(published)} packages")
              except Exception as error:
                  print(f"WARNING: could not read prior repo, rebuilding all: {error}", file=sys.stderr)

          def norm(version: str) -> str:
              return version.replace('~', '.')

          build = []
          for package in config['packages']:
              name = package['name']
              version = package.get('version', '')
              expected_key = identity(name)['build_key']
              identity_matches = (
                  published_keys.get(name) == expected_key
                  and outputs_match(name)
              )
              # A selected recovery package is intentionally forced through
              # the build even when a stale result with the same version exists.
              if selected:
                  should_build = name in selected
              else:
                  should_build = (
                      full
                      or name in changed
                      or name not in published
                      or norm(published[name]) != norm(version)
                      or not identity_matches
                  )
              if should_build:
                  build.append(package)
              else:
                  print(f"skip {name} {version}: already published")

          # Numeric stages remain the conservative repository-ordering
          # boundary. Within them, these explicitly reviewed late closures may
          # proceed independently: WebKitGTK/mozjs140, then gjs, then the
          # WebKit/GNOME shell consumers. Everything else stays in its normal
          # stage and cannot outrun an unclassified dependency.
          invalid_stages = [
              p['name'] for p in build
              if not isinstance(p.get('stage', 0), int) or not 0 <= p.get('stage', 0) <= 4
          ]
          if invalid_stages:
              raise SystemExit(f"unsupported stage for packages: {', '.join(sorted(invalid_stages))}")
          lane_config = tomllib.loads(Path('config/build-lanes.toml').read_text())
          late0 = set(lane_config.get('stage0_late', {}).get('packages', []))
          heavy1 = set(lane_config.get('stage1_heavy', {}).get('packages', []))
          late2 = set(lane_config.get('stage2_late', {}).get('packages', []))
          late3 = set(lane_config.get('stage3_late', {}).get('packages', []))
          configured = late0 | heavy1 | late2 | late3
          if not configured <= {p['name'] for p in config['packages']}:
              raise SystemExit('build lane config names packages absent from source manifest')
          outputs = {'build_list': json.dumps([p['name'] for p in build])}
          lanes = {
              'stage0': [p['name'] for p in build if (p.get('stage') or 0) == 0 and p['name'] not in late0],
              'stage0_late': [p['name'] for p in build if (p.get('stage') or 0) == 0 and p['name'] in late0],
              'stage1': [p['name'] for p in build if (p.get('stage') or 0) == 1 and p['name'] not in heavy1],
              'stage1_heavy': [p['name'] for p in build if (p.get('stage') or 0) == 1 and p['name'] in heavy1],
              'stage2': [p['name'] for p in build if (p.get('stage') or 0) == 2 and p['name'] not in late2],
              'stage2_late': [p['name'] for p in build if (p.get('stage') or 0) == 2 and p['name'] in late2],
              'stage3': [p['name'] for p in build if (p.get('stage') or 0) == 3 and p['name'] not in late3],
              'stage3_late': [p['name'] for p in build if (p.get('stage') or 0) == 3 and p['name'] in late3],
              'stage4': [p['name'] for p in build if (p.get('stage') or 0) == 4],
          }
          assigned = set().union(*(set(items) for items in lanes.values()))
          if assigned != {p['name'] for p in build}:
              raise SystemExit('lane assignment does not cover build_list exactly')
          for name, packages in lanes.items():
              outputs[name] = json.dumps(packages)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key, value in outputs.items():
                  handle.write(f'{key}={value}\n')
          print(f"will build {len(build)} of {len(config['packages'])} packages")
          PY

  preflight:
    # Every missing platform dependency has so far been found the slow way: a
    # stage fails, we read one "No match for argument" line, add one package,
    # and wait another half hour for the next one. gtk4 needed pango >= 1.58.0
    # that Fedora 44 does not carry. This job resolves every recipe's
    # BuildRequires in the real build root up front, so one run enumerates all
    # of the gaps instead of one per round.
    #
    # It never gates a build. A requirement listed here may be perfectly fine:
    # a later-stage package legitimately BuildRequires something an earlier
    # stage has not built yet, and that is indistinguishable from a real gap
    # without resolving against the staged output. Read it as a worklist.
    needs: prepare
    if: needs.prepare.outputs.build_list != '[]'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve BuildRequires for packages being built
        env:
          FACTORY_REPO: ${{ vars.FACTORY_REPO || 'https://projectbluefin.github.io/utah-packages/' }}
          BUILD_LIST: ${{ needs.prepare.outputs.build_list }}
        run: |
          mkdir -p work/reports
          docker run --rm \
            -e FACTORY_REPO -e BUILD_LIST \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            quay.io/fedora/fedora:44 bash -exc '
              disable=--disablerepo=fedora-cisco-openh264
              # The Fedora container images set tsflags=nodocs, so every %doc file is
              # dropped at install time. rand_core ships its crate docs that way and
              # its lib.rs does #![doc = include_str!("../README.md")], so rust-just
              # failed to compile: rustc could not read ../README.md. Nothing was wrong
              # with the Fedora package: mock installs docs into a build root, and
              # this container was not. Restore that.
              sed -i "/^tsflags=nodocs/d" /etc/dnf/dnf.conf
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              if [ -n "${FACTORY_REPO:-}" ]; then
                printf "[factory]\nname=factory\nbaseurl=%s\nenabled=1\ngpgcheck=0\npriority=5\n" \
                  "$FACTORY_REPO" > /etc/yum.repos.d/factory.repo
              fi
              dnf -y $disable install dnf-plugins-core rpm-build @buildsys-build
              rpm -q --qf "buildroot openssl: %{VERSION}-%{RELEASE}\n" openssl-libs || true
              : > /work/reports/preflight.txt
              # Only resolve BuildRequires for packages this run will actually
              # build (the incremental matrix), not the whole tree.
              # BUILD_LIST is a JSON array; strip brackets, quotes and commas
              # without ever writing a literal quote character.
              for package in $(echo "$BUILD_LIST" | sed -e s/\\[// -e s/\\]// -e s/\\\"//g -e s/,/ /g); do
                dir="/packages/$package"
                test -d "$dir" || { echo "build_list names missing dir: $dir" >> /work/reports/preflight.txt; continue; }
                spec=$(find "$dir" -maxdepth 1 -name "*.spec" -print -quit)
                test -n "$spec" || continue
                # --assumeno resolves the transaction without installing it,
                # but it also *declines* the transaction, so dnf exits non-zero
                # even when resolution succeeded. Keying off the exit status
                # listed all 70 recipes as failures and buried the real ones.
                # Judge by the error text instead.
                output=$(dnf $disable --assumeno builddep -D "_sourcedir $dir" "$spec" 2>&1 || true)
                # Two classes, and they are not equally trustworthy.
                #
                # "No match for argument" means a capability nothing in the root
                # provides. That has been reliable: it is how the real pango gap
                # was found.
                #
                # "cannot install both" is a version conflict between the layered
                # repositories and what @System already carries, and it has been
                # not a reliable predictor: packages have built successfully after
                # reporting one here. The resolution
                # this job performs is not the one the build performs, so conflicts
                # are recorded separately and must not be treated as gaps.
                missing=$(printf "%s\n" "$output" \
                  | grep -E "No match for argument|nothing provides" || true)
                conflict=$(printf "%s\n" "$output" | grep -E "cannot install" || true)
                if [ -n "$missing" ] || [ -n "$conflict" ]; then
                  printf "%s\n" "$package" >> /work/reports/preflight.txt
                  if [ -n "$missing" ]; then
                    printf "%s\n" "$missing" | sed "s/^/    MISSING  /" >> /work/reports/preflight.txt
                  fi
                  if [ -n "$conflict" ]; then
                    printf "%s\n" "$conflict" | sed "s/^/    conflict(unreliable)  /" >> /work/reports/preflight.txt
                  fi
                fi
              done
              echo "=== recipes with unresolved BuildRequires ==="
              cat /work/reports/preflight.txt
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-buildrequires
          path: work/reports/preflight.txt
          if-no-files-found: warn
  rebuild0:
    needs: prepare
    if: needs.prepare.outputs.stage0 != '[]'
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s0
      packages: ${{ needs.prepare.outputs.stage0 }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  rebuild0_late:
    needs: [prepare, rebuild0]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.stage0_late != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s0-late
      packages: ${{ needs.prepare.outputs.stage0_late }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  rebuild1:
    needs: [prepare, rebuild0, rebuild0_late]
    if: ${{ !cancelled() && needs.prepare.outputs.stage1 != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s1-fast
      packages: ${{ needs.prepare.outputs.stage1 }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  rebuild1_heavy:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.stage1_heavy != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s1-heavy
      packages: ${{ needs.prepare.outputs.stage1_heavy }}
      runner: ${{ vars.UTAH_HEAVY_RUNNER || 'ubuntu-24.04' }}
      timeout: '360'
    secrets: inherit

  rebuild2:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1]
    if: ${{ !cancelled() && needs.prepare.outputs.stage2 != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s2-fast
      packages: ${{ needs.prepare.outputs.stage2 }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  rebuild2_late:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.stage2_late != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s2-late
      packages: ${{ needs.prepare.outputs.stage2_late }}
      runner: ubuntu-24.04
      timeout: '240'
    secrets: inherit

  rebuild3:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild2]
    if: ${{ !cancelled() && needs.prepare.outputs.stage3 != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s3-fast
      packages: ${{ needs.prepare.outputs.stage3 }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  rebuild3_late:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.stage3_late != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s3-late
      packages: ${{ needs.prepare.outputs.stage3_late }}
      runner: ubuntu-24.04
      timeout: '240'
    secrets: inherit

  rebuild4:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late]
    if: ${{ always() && !cancelled() && needs.prepare.outputs.stage4 != '[]' }}
    uses: ./.github/workflows/rebuild-lane.yml
    with:
      lane: s4
      packages: ${{ needs.prepare.outputs.stage4 }}
      runner: ubuntu-24.04
      timeout: '180'
    secrets: inherit

  # Persist completed stages before later stages finish. These checkpoints are
  # deliberately separate from `latest`: the building tag may be incoherent
  # and is only a recovery/build input. Each job downloads every successful
  # package artifact available in this run, merges it with the prior partial
  # candidate, and serializes the push through the same accumulator lock.
  checkpoint0:
    needs: [prepare, rebuild0]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage0
    secrets: inherit

  checkpoint0-late:
    needs: [prepare, rebuild0, rebuild0_late, checkpoint0]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage0-late
    secrets: inherit

  checkpoint1-fast:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, checkpoint0-late]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage1-fast
    secrets: inherit

  checkpoint1-heavy:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, checkpoint1-fast]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage1-heavy
    secrets: inherit

  checkpoint2-fast:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild2, checkpoint1-heavy]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage2-fast
    secrets: inherit

  checkpoint2-late:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, checkpoint2-fast]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage2-late
    secrets: inherit

  checkpoint3-fast:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild2, rebuild3, checkpoint2-late]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage3-fast
    secrets: inherit

  checkpoint3-late:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late, checkpoint3-fast]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage3-late
    secrets: inherit

  checkpoint4:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late, rebuild4, checkpoint3-late]
    if: >-
      ${{ always() && !cancelled() && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checkpoint.yml
    with:
      lane: stage4
    secrets: inherit

  # A disttag is a convention, not a guarantee. What actually has to be true is
  # that every RPM we publish outranks whatever Fedora 44 and Hummingbird offer
  # under the same name -- otherwise dnf installs theirs and the rebuild we went
  # to the trouble of making is never used. Nothing checked that, and it fails
  # silently: the image still resolves, just to the wrong build.
  #
  # This resolves each name against those repositories, with our own output not
  # in the picture, and compares. It reports every offender before failing, so
  # one run yields the whole worklist instead of one entry at a time.
  precedence:
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late, rebuild4]
    if: ${{ !cancelled() && needs.prepare.outputs.build_list != '[]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-*
          path: built
          merge-multiple: true
      - name: Assert our builds outrank Fedora and Hummingbird
        run: |
          docker run --rm \
            -v "$PWD/built:/built:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            quay.io/fedora/fedora:44 bash -exc '
              dnf -y install rpmdevtools >/dev/null
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              disable=--disablerepo=fedora-cisco-openh264
              fmt="%|EPOCH?{%{EPOCH}:}|%{VERSION}-%{RELEASE}"
              : > /tmp/losers
              : > /tmp/overlap
              find /built -name "*.rpm" -type f | sort | while read -r rpm; do
                case "$rpm" in
                  *.src.rpm) continue ;;
                  # The malcontent bootstrap is ranked below the real build on
                  # purpose and is deleted before publish. It is meant to lose.
                  *-0.bootstrap.*) continue ;;
                esac
                name=$(rpm -qp --qf "%{NAME}" "$rpm" 2>/dev/null) || continue
                ours=$(rpm -qp --qf "$fmt" "$rpm")
                line=$(dnf -q $disable repoquery --latest-limit=1 \
                         --qf "$fmt %{reponame}" "$name" 2>/dev/null | tail -n1)
                theirs=${line%% *}
                repo=${line##* }
                # Nothing else ships this name, so there is nothing to outrank.
                [ -n "$theirs" ] || continue
                rc=0; rpmdev-vercmp "$ours" "$theirs" >/dev/null 2>&1 || rc=$?
                # 11 means the first argument is newer, which is what we need.
                # 0 (equal) and 12 (theirs newer) both mean ours will not win.
                [ "$rc" = 11 ] || echo "  $name: ours $ours, $repo has $theirs" >> /tmp/losers
                # .hum1.bfin outranks .hum1 at equal release by construction, so
                # a package the base OS also ships no longer appears as a loser.
                # It is still worth knowing about: this factory is for the
                # desktop stack Hummingbird does not ship.
                case "$repo" in
                  *hummingbird*) echo "  $name: ours $ours, $repo also has $theirs" >> /tmp/overlap ;;
                esac
              done
              if [ -s /tmp/losers ]; then
                echo "These builds do not outrank what the repositories already offer,"
                echo "so dnf would install the other one:"
                cat /tmp/losers
                echo
                echo "Our disttag outranks both Fedora and Hummingbird at an equal"
                echo "release, so a loser here means the thing we forked has moved on:"
                echo "its leading release segment is now higher than ours. Rebase the"
                echo "spec on the newer dist-git, which raises ours to match."
                echo
                echo "If the release has NOT moved and we simply need to build it again,"
                echo "add \"dist_bump\" to the package in config/upstream-sources.json"
                echo "instead. That appends .N after .bfin, which is what AlmaLinux does"
                echo "with .alma.1. It cannot help with a release bump, because the"
                echo "leading segment comes from the spec."
                exit 1
              fi
              if [ -s /tmp/overlap ]; then
                echo "Note: Hummingbird also ships these, and we outrank it:"
                cat /tmp/overlap
                echo "The remit is the desktop stack Hummingbird does not ship, so each of"
                echo "these is worth checking. Not a failure."
              fi
              echo "every build outranks what Fedora 44 and Hummingbird offer"
            '

  publish:
    # The consumer tag is atomic. Successful artifacts from a failed matrix are
    # still retained by Actions for diagnosis, but they never replace the
    # coherent repository Utah consumes. Publication requires every selected
    # stage plus precedence and the Hummingbird-only transaction below.
    #
    # This is no longer main-only. The repository is published as an OCI image
    # first and to Pages second, and the OCI push is what consumers actually
    # read. Pages can only deploy from the default branch, which meant nothing
    # existed to consume until a merge landed -- so an image could never be
    # tested against the packages it was meant to use before merging either of
    # them. A registry has no such rule.
    #
    # A pull request from a fork is the exception, and it has to be stated
    # rather than assumed: GitHub gives those a read-only GITHUB_TOKEN, so the
    # GHCR login and push would fail however the rest of the run went. Skipping
    # is honest; failing on a permission that was never going to be granted is
    # noise that reads like a broken pipeline.
    if: >-
      ${{ !cancelled()
          && needs.prepare.outputs.build_list != '[]'
          && inputs.packages == ''
          && needs.precedence.result == 'success'
          && (needs.rebuild0.result == 'success' || needs.rebuild0.result == 'skipped')
          && (needs.rebuild1.result == 'success' || needs.rebuild1.result == 'skipped')
          && (needs.rebuild1_heavy.result == 'success' || needs.rebuild1_heavy.result == 'skipped')
          && (needs.rebuild2.result == 'success' || needs.rebuild2.result == 'skipped')
          && (needs.rebuild2_late.result == 'success' || needs.rebuild2_late.result == 'skipped')
          && (needs.rebuild3.result == 'success' || needs.rebuild3.result == 'skipped')
          && (needs.rebuild3_late.result == 'success' || needs.rebuild3_late.result == 'skipped')
          && (needs.rebuild4.result == 'success' || needs.rebuild4.result == 'skipped')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late, rebuild4, precedence]
    # Build waves can overlap, but `:latest` is an atomic consumer input. Queue
    # only this critical section per ref; the later publisher re-seeds from the
    # repository that its predecessor just made current.
    concurrency:
      group: utah-packages-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.oci.outputs.ref }}
      digest: ${{ steps.oci.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Seed repository from the last published factory image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages:latest"
          mkdir -p repository
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          if podman pull "$image"; then
            container=$(podman create "$image")
            podman cp "$container:/repository/." repository/
            podman rm "$container"
          else
            echo "No prior factory image; publishing a new repository"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-*
          path: repository
          merge-multiple: true
      - name: Record exact package identities in the final candidate
        run: python3 tools/build_manifest.py repository
      - name: Create and keylessly sign repository metadata
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c
          # The malcontent bootstrap pass exists only to give the next stage a
          # malcontent-libs linked against accountsservice 26, breaking the
          # flatpak-libs -> libmalcontent-0.so.0 cycle. It has no parental
          # controls UI, so it must not reach anyone's system. Its release is
          # 0.bootstrap, below the real build, so this is belt and braces.
          find repository -name '*-0.bootstrap.*.rpm' -print -delete
          createrepo_c --update repository
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          install -m 0755 cosign /usr/local/bin/cosign
          cosign sign-blob --yes --bundle repository/repodata/repomd.xml.bundle repository/repodata/repomd.xml
      - name: Validate Hummingbird-only consumer transaction
        run: |
          CONTRACT=$(python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml)
          BASE_IMAGE=$(python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --base-image)
          export CONTRACT
          docker run --rm \
            -e CONTRACT \
            -v "$PWD/repository:/repository:ro,Z" \
            -v "$PWD/config:/config:ro,Z" \
            "$BASE_IMAGE" bash -euo pipefail -c '
              cp /config/hummingbird.repo /etc/yum.repos.d/hummingbird.repo
              cat >/etc/yum.repos.d/factory.repo <<EOF
          [factory]
          name=Utah package factory candidate
          baseurl=file:///repository
          enabled=1
          gpgcheck=0
          EOF
              mapfile -t packages <<<"$CONTRACT"
              test "${#packages[@]}" -gt 0
              DNF=$(command -v dnf5 || command -v dnf)
              output=$($DNF --assumeno --setopt=install_weak_deps=False \
                --disablerepo="*" \
                --enablerepo=factory \
                --enablerepo=public-hummingbird-x86_64-rpms \
                install "${packages[@]}" 2>&1 || true)
              printf "%s\n" "$output"
              if grep -Eqi "No match for argument|nothing provides|conflicting requests|cannot install both|does not belong to a distupgrade repository" <<<"$output"; then
                echo "Hummingbird-only consumer transaction is not resolvable" >&2
                exit 1
              fi
              if ! grep -Eq "Transaction Summary|Nothing to do" <<<"$output"; then
                echo "DNF did not produce a valid transaction summary" >&2
                exit 1
              fi
              echo "Hummingbird-only consumer transaction resolves ${#packages[@]} packages"
            '
      # The repository as an OCI image, which is how everything else in this
      # ecosystem ships build output: Utah Containerfile already pulls
      # projectbluefin/common and ublue-os/brew this way, pinned by digest.
      #
      # A registry beats a Pages site here on three counts. It works from any
      # branch, so an image can be built against a package set before either is
      # merged. It is addressable by digest, so an image records exactly which
      # packages went into it rather than whatever the site served that day. And
      # provenance comes from the registry and a signature over the digest,
      # rather than from an unsigned directory of RPMs over HTTPS.
      - name: Publish the repository as an OCI image
        id: oci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages"
          # main publishes the tag consumers follow; every other ref publishes
          # under its own name so it can be tested without touching main.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tag=latest
          else
            tag=$(echo "${{ github.ref_name }}" | tr "/" "-" | tr -cd "[:alnum:]._-" | cut -c1-96)
          fi
          printf "FROM scratch\nCOPY repository /repository\n" > Containerfile.repo
          # cosign signs by pushing to the same registry, but it reads the
          # Docker config rather than podman own auth file, so the login has to
          # land somewhere both of them look. DOCKER_CONFIG is set on this step
          # and on the signing step to the same directory.
          mkdir -p "${DOCKER_CONFIG}"
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" \
            --password-stdin --authfile "${DOCKER_CONFIG}/config.json"
          podman build --tag "${image}:${tag}" --file Containerfile.repo .
          podman push "${image}:${tag}" --digestfile /tmp/digest \
            --authfile "${DOCKER_CONFIG}/config.json"
          digest=$(cat /tmp/digest)
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${image}:${tag}"
          echo "consume it with: ${image}@${digest}"
          {
            echo "### Package repository published"
            echo
            echo '```'
            echo "${image}:${tag}"
            echo "${image}@${digest}"
            echo '```'
            echo
            echo "Consume in a Containerfile:"
            echo '```dockerfile'
            echo "FROM ${image}@${digest} AS packages"
            echo "COPY --from=packages /repository /etc/utah-packages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the published image
        env:
          COSIGN_YES: "true"
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          cosign sign "ghcr.io/${owner}/utah-packages@${{ steps.oci.outputs.digest }}"
      # Handed to the Pages job rather than deployed here, so that the registry
      # push never depends on the github-pages environment. That environment
      # usually carries a deployment branch rule, and inheriting it would have
      # blocked this job on exactly the branches the OCI push exists to serve.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository
          path: repository
          retention-days: 1

  # A convenience mirror for anything wanting a plain HTTP repository. Pages can
  # only deploy from the default branch, which is why it is no longer the thing
  # consumers depend on.
  publish_pages:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repository
          path: repository
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: repository
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # Persist every RPM this run built, even when some package in the matrix
  # failed or the run was cancelled downstream. `publish` only fires when every
  # stage is green, so before this job a wave that built 200 packages and
  # failed on the 201st published nothing and the next wave rebuilt all 200.
  #
  # This job is the build cache, not the consumer tag. It seeds from the same
  # accumulator it pushes to, merges whatever RPMs the matrix produced this run
  # (a failed matrix job uploads no RPM, so only successes are added), and
  # pushes to ghcr.io/<owner>/utah-packages:building. It does NOT sign or run
  # the Hummingbird-only consumer contract: `:building` may be incoherent (a
  # package built against a dependency a later wave changed, or two versions
  # across waves) and must never be installed by a consumer. `:latest` remains
  # the atomic, contract-gated tag `publish` produces.
  #
  # `prepare` reads this accumulator for its skip list and FACTORY_REPO points
  # at it, so a success persists across waves regardless of whether the wave it
  # was built in ever reached `publish`.
  accumulate:
    if: >-
      ${{ always() && !cancelled()
          && needs.prepare.outputs.build_list != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [prepare, rebuild0, rebuild0_late, rebuild1, rebuild1_heavy, rebuild2, rebuild2_late, rebuild3, rebuild3_late, rebuild4]
    # Serialise all cache writers so overlapping refs cannot clobber each
    # other's createrepo metadata. Do not cancel: a late writer still
    # carries RPMs worth keeping.
    concurrency:
      # `:building` is a shared recovery pool. Serialize all refs so a main
      # run and a pull request cannot overwrite each other's partial results.
      group: utah-packages-accumulate-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Seed cache from the building accumulator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          mkdir -p repository
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Prefer the running accumulator; fall back to the coherent consumer
          # tag on first ever run, then to an empty repository.
          for image in "ghcr.io/${owner}/utah-packages:building" "ghcr.io/${owner}/utah-packages:latest"; do
            if podman pull "$image"; then
              container=$(podman create "$image")
              podman cp "$container:/repository/." repository/ || true
              podman rm "$container"
              echo "seeded from $image"
              break
            fi
          done
          echo "No accumulator or consumer image yet; starting empty" >&2 || true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-*
          path: repository
          merge-multiple: true
      - name: Record exact package identities in the cache
        run: python3 tools/build_manifest.py repository
      - name: Rebuild cache metadata
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y createrepo-c
          # The malcontent bootstrap RPM must never persist: it ships no
          # parental-controls UI and exists only to break a build cycle within a
          # single run. Drop it from the cache exactly as `publish` does.
          find repository -name '*-0.bootstrap.*.rpm' -print -delete
          test -n "$(find repository -name '*.rpm' -type f -print -quit)" || {
            echo "No RPMs to accumulate; nothing to push" >&2
            exit 0
          }
          createrepo_c --update repository
      - name: Push the building accumulator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -d repository/repodata || { echo "no repodata; skipping push"; exit 0; }
          owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages:building"
          printf "FROM scratch\nCOPY repository /repository\n" > Containerfile.building
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman build --tag "$image" --file Containerfile.building .
          podman push "$image"
          count=$(find repository -name '*.rpm' -type f | wc -l)
          echo "accumulated $count RPMs into $image"
          {
            echo "### Build cache updated"
            echo
            echo "\`$image\` now carries $count RPMs (all successful builds across waves)."
          } >> "$GITHUB_STEP_SUMMARY"
