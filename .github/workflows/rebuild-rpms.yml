name: Build verified upstream RPMs

on:
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every package, ignoring what is already published
        required: false
        default: false
        type: boolean
      backend:
        description: >
          How to build. container is the hand-simulated build root every
          published RPM was built in. mock is a real mock root, the way Packit
          builds locally; it is unproven here, so it is dispatch-only.
        required: false
        default: container
        type: choice
        options:
          - container
          - mock
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

# Build waves may run concurrently.  The consumer tag itself remains serialized
# at `publish`, and publish refuses to replace an image that advanced while the
# run was building.  That keeps an older run from overwriting newer artifacts.
#
# Pull requests and merges run the validation workflow, not this
# several-hundred-job factory. Only the daily schedule or an explicit dispatch
# may consume the build queue. Publication itself remains serialized below.

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      # The build root this factory intends to use, recorded so the choice is
      # auditable and so Renovate keeps the digest current through the
      # build-root-image manager in renovate.json.
      #
      # It is the EXPECTED value, not the pull target. quay.io/fedora/fedora:44
      # is republished several times a day and each previous digest is
      # garbage-collected, so a digest here is dead within hours: 3a6e77a
      # pinned a58a82ed on 09-12, it was 404 by 09-17; the replacement
      # 61beafd3, resolved and verified 200 at 03:50 on 09-17, was 404 by
      # 07:13 the same morning. Fedora publishes no immutable tag -- only 44
      # and its per-arch variants -- so there is nothing stable to pin to.
      #
      # Pulling by that digest is what broke run 35186196830: stages 0 to 3
      # pulled it at 06:01 and stages 4 to 10 got
      #   manifest for quay.io/fedora/fedora@sha256:61beafd3... not found
      # thirty-seven jobs dead on exit 125, mid-run, from a pin that had been
      # correct when the run started. So the tag is pulled once here and the
      # bytes are shared with every job; a mismatch against this digest is
      # reported, not fatal, because failing on it recreates that outage.
      BUILDROOT_IMAGE: quay.io/fedora/fedora:44@sha256:94e175d9796d3582d4d3cdcff1004bd67cc51dc45df452d3b16f76f071c7c487
    outputs:
      buildroot_digest: ${{ steps.buildroot.outputs.digest }}
      factory_image: ${{ steps.factory_image.outputs.image }}
      stage0: ${{ steps.matrix.outputs.stage0 }}
      stage1: ${{ steps.matrix.outputs.stage1 }}
      stage2: ${{ steps.matrix.outputs.stage2 }}
      stage3: ${{ steps.matrix.outputs.stage3 }}
      stage4: ${{ steps.matrix.outputs.stage4 }}
      stage0_chunks: ${{ steps.matrix.outputs.stage0_chunks }}
      stage1_chunks: ${{ steps.matrix.outputs.stage1_chunks }}
      stage2_chunks: ${{ steps.matrix.outputs.stage2_chunks }}
      stage3_chunks: ${{ steps.matrix.outputs.stage3_chunks }}
      stage4_chunks: ${{ steps.matrix.outputs.stage4_chunks }}
      stage5: ${{ steps.matrix.outputs.stage5 }}
      stage6: ${{ steps.matrix.outputs.stage6 }}
      stage7: ${{ steps.matrix.outputs.stage7 }}
      stage8: ${{ steps.matrix.outputs.stage8 }}
      stage9: ${{ steps.matrix.outputs.stage9 }}
      stage10: ${{ steps.matrix.outputs.stage10 }}
      stage5_chunks: ${{ steps.matrix.outputs.stage5_chunks }}
      stage6_chunks: ${{ steps.matrix.outputs.stage6_chunks }}
      stage7_chunks: ${{ steps.matrix.outputs.stage7_chunks }}
      stage8_chunks: ${{ steps.matrix.outputs.stage8_chunks }}
      stage9_chunks: ${{ steps.matrix.outputs.stage9_chunks }}
      stage10_chunks: ${{ steps.matrix.outputs.stage10_chunks }}
      build_list: ${{ steps.matrix.outputs.build_list }}
      cacheable: ${{ steps.matrix.outputs.cacheable }}
      prune_sources: ${{ steps.matrix.outputs.prune_sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate factory policy and tests
        run: |
          python3 tools/check_workflow_quoting.py
          python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --check
          python3 -m unittest discover -s tests -v
      - name: Install zstandard
        run: pip install --disable-pip-version-check --quiet 'zstandard==0.25.0'
      # Pulled once for the whole run, then handed to every job as an
      # artifact. Two things this fixes that a digest pin cannot: the image
      # cannot rot between the pin being written and the run starting, and it
      # cannot rot between one stage and the next -- every job provably uses
      # the same bytes, which is a stronger reproducibility claim than the pin
      # made. It also replaces roughly three hundred registry pulls with one.
      - name: Pull the build root once and record what it resolved to
        id: buildroot
        run: |
          tag="${BUILDROOT_IMAGE%@*}"
          expected="${BUILDROOT_IMAGE##*@}"
          docker pull "$tag"
          actual=$(docker image inspect "$tag" \
            --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::warning title=build root moved::$tag now resolves to $actual, not the recorded $expected. The run continues on what it resolved to; update BUILDROOT_IMAGE to re-record it." >&2
          fi
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
          # A bare name, deliberately. Every job runs this image by that name
          # with no registry behind it, so a job that failed to load the
          # artifact cannot silently fall back to pulling something else --
          # docker refuses an unqualified name it does not have locally.
          docker tag "$tag" utah-buildroot:run
          docker save utah-buildroot:run | zstd -T0 -3 -o buildroot.tar.zst
          ls -l buildroot.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buildroot-image
          path: buildroot.tar.zst
          if-no-files-found: error
          retention-days: 1
      # The published repository is the witness for what may be skipped, and
      # it lives in one place: the OCI image publish writes. It used to be
      # read over HTTP from a GitHub Pages mirror that had been retired but
      # never taken down, frozen at 67 packages from before the 343-recipe
      # contract. Every run therefore skipped 7 and rebuilt 333, whatever had
      # changed -- eight hours for a one-line spec fix, and webkitgtk alone
      # five of them, on the serial path, with no change to its recipe.
      #
      # Resolved once here to a digest, like the build root, so every job in
      # the run reads the same repository even if publish moves the tag while
      # the run is in flight. A branch reads its own image first, so a second
      # push to a pull request skips what the first push built; main only ever
      # reads latest. No image at all is not an error: it means nothing can
      # be skipped, which is what rebuild_plan.py does with an empty witness.
      - name: Resolve the published factory image
        id: factory_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages"
          branch=$(printf '%s' "$REF_NAME" \
            | tr "/" "-" | tr -cd "[:alnum:]._-" | cut -c1-96)
          if [ "$REF" = "refs/heads/main" ]; then
            candidates="latest"
          else
            candidates="$branch latest"
          fi
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "$ACTOR" --password-stdin \
            || echo "::warning title=ghcr login failed::resolving the factory image anonymously"
          resolved=
          for tag in $candidates; do
            if docker pull "${image}:${tag}"; then
              digest=$(docker image inspect "${image}:${tag}" \
                --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
              resolved="${image}@${digest}"
              echo "factory repository: ${image}:${tag} -> ${resolved}"
              break
            fi
            echo "no factory image at ${image}:${tag}"
          done
          if [ -z "$resolved" ]; then
            echo "::warning title=no factory image::nothing is published for this ref or main, so nothing can be skipped as already built"
          fi
          echo "image=${resolved}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/load-factory-repo
        id: factory
        with:
          image: ${{ steps.factory_image.outputs.image }}
      - id: matrix
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true && '1' || '0' }}
          BASE_SHA: ${{ github.event.before }}
          FACTORY_URL: ${{ steps.factory.outputs.url }}
        run: |
          # The action reports the path as the build container sees it under
          # /work; this step runs on the host, so read the same directory
          # from the workspace. Same bytes, and the only witness there is.
          if [ -n "$FACTORY_URL" ]; then
            export FACTORY_REPO="file://$PWD/work/factory"
          else
            export FACTORY_REPO=
          fi
          python3 tools/rebuild_matrix.py

  preflight:
    # Every missing platform dependency has so far been found the slow way: a
    # stage fails, we read one "No match for argument" line, add one package,
    # and wait another half hour for the next one. gtk4 needed pango >= 1.58.0
    # that Fedora 44 does not carry. This job resolves every recipe's
    # BuildRequires in the real build root up front, so one run enumerates all
    # of the gaps instead of one per round.
    #
    # It never gates a build. A requirement listed here may be perfectly fine:
    # a later-stage package legitimately BuildRequires something an earlier
    # stage has not built yet, and that is indistinguishable from a real gap
    # without resolving against the staged output. Read it as a worklist.
    needs: prepare
    if: needs.prepare.outputs.build_list != '[]'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/load-buildroot
      - uses: ./.github/actions/load-factory-repo
        id: factory
        with:
          image: ${{ needs.prepare.outputs.factory_image }}
      - name: Resolve BuildRequires for packages being built
        env:
          FACTORY_REPO: ${{ steps.factory.outputs.url }}
          BUILD_LIST: ${{ needs.prepare.outputs.build_list }}
        run: |
          mkdir -p work/reports
          docker run --rm \
            -e FACTORY_REPO -e BUILD_LIST \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            utah-buildroot:run bash -exc '
              disable=--disablerepo=fedora-cisco-openh264
              # The Fedora container images set tsflags=nodocs, so every %doc file is
              # dropped at install time. rand_core ships its crate docs that way and
              # its lib.rs does #![doc = include_str!("../README.md")], so rust-just
              # failed to compile: rustc could not read ../README.md. Nothing was wrong
              # with the Fedora package: mock installs docs into a build root, and
              # this container was not. Restore that.
              sed -i "/^tsflags=nodocs/d" /etc/dnf/dnf.conf
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              if [ -n "${FACTORY_REPO:-}" ]; then
                printf "[factory]\nname=factory\nbaseurl=%s\nenabled=1\ngpgcheck=0\npriority=5\n" \
                  "$FACTORY_REPO" > /etc/yum.repos.d/factory.repo
              fi
              dnf -y $disable install dnf-plugins-core rpm-build @buildsys-build
              rpm -q --qf "buildroot openssl: %{VERSION}-%{RELEASE}\n" openssl-libs || true
              : > /work/reports/preflight.txt
              # Only resolve BuildRequires for packages this run will actually
              # build (the incremental matrix), not the whole tree.
              # BUILD_LIST is a JSON array; strip brackets, quotes and commas
              # without ever writing a literal quote character.
              for package in $(echo "$BUILD_LIST" | sed -e s/\\[// -e s/\\]// -e s/\\\"//g -e s/,/ /g); do
                dir="/packages/$package"
                test -d "$dir" || { echo "build_list names missing dir: $dir" >> /work/reports/preflight.txt; continue; }
                spec=$(find "$dir" -maxdepth 1 -name "*.spec" -print -quit)
                test -n "$spec" || continue
                # --assumeno resolves the transaction without installing it,
                # but it also *declines* the transaction, so dnf exits non-zero
                # even when resolution succeeded. Keying off the exit status
                # listed all 70 recipes as failures and buried the real ones.
                # Judge by the error text instead.
                output=$(dnf $disable --assumeno builddep -D "_sourcedir $dir" "$spec" 2>&1 || true)
                # Two classes, and they are not equally trustworthy.
                #
                # "No match for argument" means a capability nothing in the root
                # provides. That has been reliable: it is how the real pango gap
                # was found.
                #
                # "cannot install both" is a version conflict between the layered
                # repositories and what @System already carries, and it has been
                # not a reliable predictor: packages have built successfully after
                # reporting one here. The resolution
                # this job performs is not the one the build performs, so conflicts
                # are recorded separately and must not be treated as gaps.
                missing=$(printf "%s\n" "$output" \
                  | grep -E "No match for argument|nothing provides" || true)
                conflict=$(printf "%s\n" "$output" | grep -E "cannot install" || true)
                if [ -n "$missing" ] || [ -n "$conflict" ]; then
                  printf "%s\n" "$package" >> /work/reports/preflight.txt
                  if [ -n "$missing" ]; then
                    printf "%s\n" "$missing" | sed "s/^/    MISSING  /" >> /work/reports/preflight.txt
                  fi
                  if [ -n "$conflict" ]; then
                    printf "%s\n" "$conflict" | sed "s/^/    conflict(unreliable)  /" >> /work/reports/preflight.txt
                  fi
                fi
              done
              echo "=== recipes with unresolved BuildRequires ==="
              cat /work/reports/preflight.txt
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-buildrequires
          path: work/reports/preflight.txt
          if-no-files-found: warn

  # Five waves of the same build, ordered so a package can resolve a
  # BuildRequires against something an earlier wave produced. The wave
  # itself lives in build-stage.yml; only the ordering is here.
  #
  # GitHub needs the chain to be static, so the count is fixed at five. A
  # sixth wave is a real decision, not a silent overflow: `prepare` fails
  # rather than dropping a package that does not fit.
  rebuild0:
    needs: prepare
    if: needs.prepare.outputs.stage0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage0_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '0'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild1:
    needs: [prepare, rebuild0]
    if: ${{ !cancelled() && needs.prepare.outputs.stage1 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage1_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '1'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild2:
    needs: [prepare, rebuild0, rebuild1]
    if: ${{ !cancelled() && needs.prepare.outputs.stage2 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage2_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '2'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild3:
    needs: [prepare, rebuild0, rebuild1, rebuild2]
    if: ${{ !cancelled() && needs.prepare.outputs.stage3 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage3_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '3'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild4:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3]
    if: ${{ !cancelled() && needs.prepare.outputs.stage4 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage4_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '4'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild5:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4]
    if: ${{ !cancelled() && needs.prepare.outputs.stage5 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage5_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '5'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild6:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5]
    if: ${{ !cancelled() && needs.prepare.outputs.stage6 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage6_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '6'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild7:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6]
    if: ${{ !cancelled() && needs.prepare.outputs.stage7 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage7_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '7'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild8:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7]
    if: ${{ !cancelled() && needs.prepare.outputs.stage8 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage8_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '8'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild9:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7, rebuild8]
    if: ${{ !cancelled() && needs.prepare.outputs.stage9 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage9_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '9'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  rebuild10:
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7, rebuild8, rebuild9]
    if: ${{ !cancelled() && needs.prepare.outputs.stage10 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.stage10_chunks) }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: '10'
      packages: ${{ matrix.chunk }}
      backend: ${{ inputs.backend || 'container' }}
      factory_image: ${{ needs.prepare.outputs.factory_image }}
      buildroot_digest: ${{ needs.prepare.outputs.buildroot_digest }}
      cacheable_packages: ${{ needs.prepare.outputs.cacheable }}

  precedence:
    # Every wave, not the first five. See publish below.
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7, rebuild8, rebuild9, rebuild10]
    # `!cancelled()` is what lets this run after a failed wave, which is the
    # point: it has to see every RPM that did build. It also let it run after
    # a failed prepare, where there is no build root artifact to load, so a
    # unit-test failure in prepare surfaced a second time as a download error
    # here (runs 372 and 379). prepare has to have succeeded.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build_list != '[]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/load-buildroot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rpm-*
          path: built
          merge-multiple: true
      - name: Assert our builds outrank Fedora and Hummingbird
        run: |
          docker run --rm \
            -v "$PWD/built:/built:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            utah-buildroot:run bash -exc '
              dnf -y install rpmdevtools >/dev/null
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              disable=--disablerepo=fedora-cisco-openh264
              fmt="%|EPOCH?{%{EPOCH}:}|%{VERSION}-%{RELEASE}"
              : > /tmp/losers
              : > /tmp/overlap
              find /built -name "*.rpm" -type f | sort | while read -r rpm; do
                case "$rpm" in
                  *.src.rpm) continue ;;
                  # The malcontent bootstrap is ranked below the real build on
                  # purpose and is deleted before publish. It is meant to lose.
                  *-0.bootstrap.*) continue ;;
                esac
                name=$(rpm -qp --qf "%{NAME}" "$rpm" 2>/dev/null) || continue
                ours=$(rpm -qp --qf "$fmt" "$rpm")
                line=$(dnf -q $disable repoquery --latest-limit=1 \
                         --qf "$fmt %{reponame}" "$name" 2>/dev/null | tail -n1)
                theirs=${line%% *}
                repo=${line##* }
                # Nothing else ships this name, so there is nothing to outrank.
                [ -n "$theirs" ] || continue
                rc=0; rpmdev-vercmp "$ours" "$theirs" >/dev/null 2>&1 || rc=$?
                # 11 means the first argument is newer, which is what we need.
                # 0 (equal) and 12 (theirs newer) both mean ours will not win.
                [ "$rc" = 11 ] || echo "  $name: ours $ours, $repo has $theirs" >> /tmp/losers
                # .hum1.bfin outranks .hum1 at equal release by construction, so
                # a package the base OS also ships no longer appears as a loser.
                # It is still worth knowing about: this factory is for the
                # desktop stack Hummingbird does not ship.
                case "$repo" in
                  *hummingbird*) echo "  $name: ours $ours, $repo also has $theirs" >> /tmp/overlap ;;
                esac
              done
              if [ -s /tmp/losers ]; then
                echo "These builds do not outrank what the repositories already offer,"
                echo "so dnf would install the other one:"
                cat /tmp/losers
                echo
                echo "Our disttag outranks both Fedora and Hummingbird at an equal"
                echo "release, so a loser here means the thing we forked has moved on:"
                echo "its leading release segment is now higher than ours. Rebase the"
                echo "spec on the newer dist-git, which raises ours to match."
                echo
                echo "If the release has NOT moved and we simply need to build it again,"
                echo "add \"dist_bump\": {\"count\": 1, \"baseline\": \"<Release:>\"}"
                echo "to the package in config/upstream-sources.json"
                echo "instead. That appends .N after .bfin, which is what AlmaLinux does"
                echo "with .alma.1. It cannot help with a release bump, because the"
                echo "leading segment comes from the spec."
                exit 1
              fi
              if [ -s /tmp/overlap ]; then
                echo "Note: Hummingbird also ships these, and we outrank it:"
                cat /tmp/overlap
                echo "The remit is the desktop stack Hummingbird does not ship, so each of"
                echo "these is worth checking. Not a failure."
              fi
              echo "every build outranks what Fedora 44 and Hummingbird offer"
            '

  publish:
    # The consumer tag is atomic. Successful artifacts from a failed matrix are
    # still retained by Actions for diagnosis, but they never replace the
    # coherent repository Utah consumes. Publication requires every selected
    # stage plus precedence and the Hummingbird-only transaction below.
    #
    # "Every selected stage" was what this said and not what it did: needs
    # stopped at rebuild4, so publication ran while stages 5 to 10 were still
    # building and validated a repository that could not yet contain their
    # output. The first run to reach the transaction check said so plainly --
    #
    #   nothing provides libepoxy.so.0()(64bit) needed by gtk4 ... from factory
    #   nothing provides libGL.so.1()(64bit) needed by libva ... from factory
    #
    # -- with libepoxy and libglvnd both at stage 6, behind the gate. The
    # dependency now covers all eleven waves, which is what makes the check
    # meaningful: it can finally see the whole repository it is judging.
    #
    # This is not main-only. The repository is published as an OCI image, and
    # that image is the only thing consumers read. A Pages mirror used to be
    # published alongside it, but Pages can only deploy from the default
    # branch, so nothing existed to consume until a merge had already landed
    # and an image could never be tested against the packages it was meant to
    # use. A registry has no such rule, so the mirror was a second publication
    # path that nothing consumed and every change had to be made twice in.
    #
    if: >-
      ${{ !cancelled()
          && needs.prepare.result == 'success'
          && (needs.prepare.outputs.build_list != '[]'
              || needs.prepare.outputs.prune_sources != '[]')
          && (needs.precedence.result == 'success'
              || (needs.prepare.outputs.build_list == '[]'
                  && needs.precedence.result == 'skipped'))
          && (needs.rebuild0.result == 'success' || needs.rebuild0.result == 'skipped')
          && (needs.rebuild1.result == 'success' || needs.rebuild1.result == 'skipped')
          && (needs.rebuild2.result == 'success' || needs.rebuild2.result == 'skipped')
          && (needs.rebuild3.result == 'success' || needs.rebuild3.result == 'skipped')
          && (needs.rebuild4.result == 'success' || needs.rebuild4.result == 'skipped')
          && (needs.rebuild5.result == 'success' || needs.rebuild5.result == 'skipped')
          && (needs.rebuild6.result == 'success' || needs.rebuild6.result == 'skipped')
          && (needs.rebuild7.result == 'success' || needs.rebuild7.result == 'skipped')
          && (needs.rebuild8.result == 'success' || needs.rebuild8.result == 'skipped')
          && (needs.rebuild9.result == 'success' || needs.rebuild9.result == 'skipped')
          && (needs.rebuild10.result == 'success' || needs.rebuild10.result == 'skipped') }}
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4, rebuild5, rebuild6, rebuild7, rebuild8, rebuild9, rebuild10, precedence]
    # Build waves can overlap, but the consumer tag is an atomic input. Queue
    # only this critical section per ref. The seed step verifies that the image
    # seen by `prepare` is still current; an older run therefore cannot publish
    # over a newer one.
    concurrency:
      group: utah-packages-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.oci.outputs.ref }}
      digest: ${{ steps.oci.outputs.digest }}
    steps:
      # The consumer-transaction check below runs tools/runtime_contract.py
      # against config/, and the OCI step reads nothing else from the tree, so
      # this job was the one that never checked the repository out. It failed
      # on `python3: can't open file .../tools/runtime_contract.py` the moment
      # the seed step stopped failing first and let it get that far.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cosign
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          echo '8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  cosign' | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign
      - name: Verify and seed repository from the prepare-time factory image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_IMAGE: ${{ needs.prepare.outputs.factory_image }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages"
          branch=$(printf '%s' "$REF_NAME" \
            | tr "/" "-" | tr -cd "[:alnum:]._-" | cut -c1-96)
          if [ "$REF" = "refs/heads/main" ]; then
            candidates="latest"
          else
            candidates="$branch latest"
          fi
          mkdir -p repository "${DOCKER_CONFIG}"
          # cosign verify below reads the Docker config, not podman's own
          # auth file (the same split the "Publish the repository" step
          # already works around), so the login has to land where cosign
          # will look, even though the package is public and every pull
          # here succeeds anonymously either way.
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "$ACTOR" \
            --password-stdin --authfile "${DOCKER_CONFIG}/config.json"
          current=
          current_ref=
          for tag in $candidates; do
            if podman pull --authfile "${DOCKER_CONFIG}/config.json" "${image}:${tag}"; then
              digest=$(podman image inspect "${image}:${tag}" \
                --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
              current="${image}@${digest}"
              # latest is only ever published from main; a branch tag is only
              # ever published by this same workflow running on that branch.
              # Recording which one matched lets verification below pin the
              # exact signer identity instead of accepting either.
              if [ "$tag" = "latest" ]; then
                current_ref="refs/heads/main"
              else
                current_ref="$REF"
              fi
              echo "current factory image: ${image}:${tag} -> ${current}"
              break
            fi
            echo "no factory image at ${image}:${tag}"
          done
          if [ "$current" != "$EXPECTED_IMAGE" ]; then
            echo "factory image advanced while this run was building" >&2
            echo "  prepare witnessed: ${EXPECTED_IMAGE:-<none>}" >&2
            echo "  publish sees:      ${current:-<none>}" >&2
            echo "refusing to overwrite the newer repository; rerun this commit" >&2
            exit 1
          fi
          if [ -z "$current" ]; then
            echo "prepare witnessed no published image; publishing a new repository"
          else
            # The seed image is only trustworthy if this workflow signed it.
            # Verify the digest actually pulled -- never the mutable tag,
            # which could move again after this check -- before creating a
            # container or copying anything out of it. Without this, anyone
            # able to push to the GHCR package once could plant RPMs in
            # :latest and have every subsequent run copy them forward, sign
            # over them, and re-publish them as verified factory output.
            cosign verify "$current" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/rebuild-rpms.yml@${current_ref}"
            # The factory image is FROM scratch with only COPY layers, no CMD or
            # ENTRYPOINT, so a bare create exits 125 with "no command or
            # entrypoint provided". A command is only recorded here, never run
            # -- the container exists to be copied out of -- so naming one that
            # the image does not even contain is enough to satisfy create.
            container=$(podman create "$current" /bin/true)
            podman cp "$container:/repository/." repository/
            podman rm "$container"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.prepare.outputs.build_list != '[]'
        with:
          pattern: rpm-*
          path: repository
          merge-multiple: true
      - name: Create and keylessly sign repository metadata
        env:
          PRUNE_SOURCES: ${{ needs.prepare.outputs.prune_sources }}
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c rpm
          # A recipe removal does not remove its RPMs from the previous OCI
          # repository we seed above. Drop every binary whose source package is
          # now owned by Hummingbird before regenerating metadata. The prepare
          # step computes this list from the repository it actually witnessed,
          # so cleanup-only runs are both retryable and idempotent.
          mapfile -t prune_sources < <(jq -r '.[]' <<<"$PRUNE_SOURCES")
          while IFS= read -r -d '' rpm_file; do
            source_rpm=$(rpm -qp --qf '%{SOURCERPM}' "$rpm_file" 2>/dev/null || true)
            for source in "${prune_sources[@]}"; do
              case "$source_rpm" in
                "$source"-*)
                  echo "remove Hummingbird-owned $rpm_file ($source_rpm)"
                  rm -f "$rpm_file"
                  break
                  ;;
              esac
            done
          done < <(find repository -type f -name '*.rpm' -print0)
          # The malcontent bootstrap pass exists only to give the next stage a
          # malcontent-libs linked against accountsservice 26, breaking the
          # flatpak-libs -> libmalcontent-0.so.0 cycle. It has no parental
          # controls UI, so it must not reach anyone's system. Its release is
          # 0.bootstrap, below the real build, so this is belt and braces.
          find repository -name '*-0.bootstrap.*.rpm' -print -delete
          # 507b2bf stopped the factory building icu, because a factory icu
          # 78.3 competed with the Hummingbird 78.3 that is already newest and
          # left consumers linking the leftover 77. The recipe went away; the
          # RPM did not. libicu-78.3-1.hum1.bfin is still carried forward from
          # the published image on every run, so the transaction kept seeing a
          # factory ICU that nothing in this tree builds and no recipe can fix.
          # git log -S over the whole history finds no libicu in the inventory,
          # so there is nothing to rebuild -- only this to stop re-seeding.
          find repository -name 'libicu-*.bfin.*.rpm' -o -name 'icu-*.bfin.*.rpm' \
            | tee /dev/stderr | xargs -r rm -f
          createrepo_c --update repository
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          echo '8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  cosign' | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign
          cosign sign-blob --yes --bundle repository/repodata/repomd.xml.bundle repository/repodata/repomd.xml
      - name: Validate Hummingbird-only consumer transaction
        run: |
          CONTRACT=$(python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml)
          BASE_IMAGE=$(python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --base-image)
          export CONTRACT
          docker run --rm \
            -e CONTRACT \
            -v "$PWD/repository:/repository:ro,Z" \
            -v "$PWD/config:/config:ro,Z" \
            "$BASE_IMAGE" bash -euo pipefail -c '
              cp /config/hummingbird.repo /etc/yum.repos.d/hummingbird.repo
              # Hummingbird ships libicu 77.1 beside 78.3, and 507b2bf settled
              # that 78 is the sole runtime ICU: the factory stopped building
              # icu so every consumer links Hummingbird 78. Nothing enforced it
              # here, so this transaction still had 77.1 to choose from and
              # split -- libtinysparql wanting libicuuc.so.78 against a samba
              # wanting .so.77, which no resolution satisfies.
              #
              # The exclusion belongs in this copy and nowhere else. 012cb6a
              # removed a blanket libicu-77 exclusion because it broke Fedora
              # build-only deps that legitimately link ICU 77 -- raptor2 via
              # gstreamer-bad, localsearch and pipewire-libs-extra
              # transitively. This transaction has no Fedora repository at all,
              # only factory plus Hummingbird, so no build-only dep can be
              # caught by it. Editing config/hummingbird.repo instead would
              # reach the build root, which is the thing 012cb6a fixed.
              #
              # Spelled with release as its own field: 1f88491 found that dnf
              # splits a package spec on its dashes before globbing each field,
              # so libicu-77.*hum1 parses its version as 77.*hum1 and matches
              # nothing at all.
              printf "excludepkgs=libicu-77.*-*hum1\n" >> /etc/yum.repos.d/hummingbird.repo
              cat >/etc/yum.repos.d/factory.repo <<EOF
          [factory]
          name=Utah package factory candidate
          baseurl=file:///repository
          enabled=1
          gpgcheck=0
          EOF
              mapfile -t packages <<<"$CONTRACT"
              test "${#packages[@]}" -gt 0
              DNF=$(command -v dnf5 || command -v dnf)
              output=$($DNF --assumeno --setopt=install_weak_deps=False \
                --disablerepo="*" \
                --enablerepo=factory \
                --enablerepo=public-hummingbird-x86_64-rpms \
                install "${packages[@]}" 2>&1 || true)
              printf "%s\n" "$output"
              if grep -Eqi "No match for argument|nothing provides|conflicting requests|cannot install both|does not belong to a distupgrade repository" <<<"$output"; then
                echo "Hummingbird-only consumer transaction is not resolvable" >&2
                exit 1
              fi
              if ! grep -Eq "Transaction Summary|Nothing to do" <<<"$output"; then
                echo "DNF did not produce a valid transaction summary" >&2
                exit 1
              fi
              echo "Hummingbird-only consumer transaction resolves ${#packages[@]} packages"
            '
      # The repository as an OCI image, which is how everything else in this
      # ecosystem ships build output: Utah Containerfile already pulls
      # projectbluefin/common and ublue-os/brew this way, pinned by digest.
      #
      # A registry beats a Pages site here on three counts. It works from any
      # branch, so an image can be built against a package set before either is
      # merged. It is addressable by digest, so an image records exactly which
      # packages went into it rather than whatever the site served that day. And
      # provenance comes from the registry and a signature over the digest,
      # rather than from an unsigned directory of RPMs over HTTPS.
      - name: Publish the repository as an OCI image
        id: oci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          image="ghcr.io/${owner}/utah-packages"
          # main publishes the tag consumers follow; every other ref publishes
          # under its own name so it can be tested without touching main.
          if [ "$REF" = "refs/heads/main" ]; then
            tag=latest
          else
            tag=$(printf '%s' "$REF_NAME" | tr "/" "-" | tr -cd "[:alnum:]._-" | cut -c1-96)
          fi
          # Two layers, and the order is a contract with Utah. Its check-repos
          # (projectbluefin/utah scripts/check-repo-availability.py) reads only
          # manifest.layers[0], requires it under 64 MiB, and accepts nothing
          # in it but repository/repodata/* -- so it can resolve dependencies
          # without pulling the multi-GB RPM payload. A single COPY put
          # everything in one 2 GB layer and Utah refused 9e17ca2c with
          #   Package image lacks a small leading metadata layer
          # The repodata is repeated in the second layer; a few MB is cheaper
          # than depending on COPY --exclude. tests/test_atomic_publish.py
          # holds the order.
          printf "FROM scratch\nCOPY repository/repodata /repository/repodata\nCOPY repository /repository\n" > Containerfile.repo
          # cosign signs by pushing to the same registry, but it reads the
          # Docker config rather than podman own auth file, so the login has to
          # land somewhere both of them look. DOCKER_CONFIG is set on this step
          # and on the signing step to the same directory.
          mkdir -p "${DOCKER_CONFIG}"
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "$ACTOR" \
            --password-stdin --authfile "${DOCKER_CONFIG}/config.json"
          podman build --tag "${image}:${tag}" --file Containerfile.repo .
          podman push "${image}:${tag}" --digestfile /tmp/digest \
            --authfile "${DOCKER_CONFIG}/config.json"
          digest=$(cat /tmp/digest)
          {
            echo "ref=${image}:${tag}"
            echo "image=${image}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          echo "published ${image}:${tag}"
          echo "consume it with: ${image}@${digest}"
          {
            echo "### Package repository published"
            echo
            echo '```'
            echo "${image}:${tag}"
            echo "${image}@${digest}"
            echo '```'
            echo
            echo "Consume in a Containerfile:"
            echo '```dockerfile'
            echo "FROM ${image}@${digest} AS packages"
            echo "COPY --from=packages /repository /etc/utah-packages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the published image
        env:
          COSIGN_YES: "true"
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          cosign sign "ghcr.io/${owner}/utah-packages@${{ steps.oci.outputs.digest }}"
      # A signature says this image came from here. Provenance says what built
      # it -- workflow, commit, runner -- which is the question asked after a
      # bad package ships, and the one a signature alone cannot answer.
      #
      # push-to-registry reads credentials from the default docker config
      # (~/.docker/config.json). The publish step logs in with podman into a
      # separate DOCKER_CONFIG under runner.temp, so run 36117470974 published
      # and signed the image and then failed here on
      #   No credentials found for registry ghcr.io
      # Log in where the action looks.
      - name: Log in to GHCR for the provenance attestation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # By this point the consumer tag has already moved and the image is
      # signed; an attestation cannot be made before the digest exists, and
      # pushing is what creates it. So a failure here must not turn the job
      # red over a repository that did publish -- that is what made 36117470974
      # look unpublished. It is non-fatal and reported loudly instead: a
      # warning annotation and a line in the job summary saying provenance is
      # missing for that digest, so it can be re-attested.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.oci.outputs.image }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - name: Report a missing provenance attestation
        if: steps.attest.outcome == 'failure'
        env:
          DIGEST: ${{ steps.oci.outputs.digest }}
          IMAGE: ${{ steps.oci.outputs.image }}
        run: |
          echo "::warning title=provenance not attested::${IMAGE}@${DIGEST} is published and signed, but its build-provenance attestation failed; see the Attest build provenance step."
          {
            echo
            echo "**Warning:** \`${IMAGE}@${DIGEST}\` is published and cosign-signed, but its build-provenance attestation failed."
          } >> "$GITHUB_STEP_SUMMARY"
