              test -n "$spec"
              dnf -y $disable ${EXCLUDE:+--setopt=fedora.excludepkgs="$EXCLUDE"} \
                ${EXCLUDE:+--setopt=updates.excludepkgs="$EXCLUDE"} builddep "$spec"
