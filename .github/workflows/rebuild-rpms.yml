            -e PACKAGE -e FACTORY_REPO -e DIST_BUMP \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            quay.io/fedora/fedora:44 bash -exc '
