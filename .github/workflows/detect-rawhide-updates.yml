name: Observe Fedora build-root availability

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, where scheduled GitHub jobs are commonly delayed.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: fedora-build-root-observation
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve current Fedora build-root package state
        run: |
          docker run --rm \
            -v "$PWD:/workspace:Z" \
            -w /workspace \
            fedora:rawhide bash -exc '
              dnf -y install dnf-plugins-core python3
              python3 tools/scan_rawhide_state.py
            '
      - name: Explain update policy
        run: |
          echo 'This reports what the Fedora BUILD ROOT currently offers. It is'
          echo 'observability: repository metadata never moves a source by itself,'
          echo 'because a package can appear in rawhide before Koji has completed'
          echo 'a build of it.'
          echo
          echo 'Sources are followed separately, in track-upstream.yml, which'
          echo 'compares each entry against Fedora dist-git and proposes the move'
          echo 'as a reviewable pull request once Koji reports that exact NVR'
          echo 'COMPLETE. Hummingbird is upstream-first: the factory tracks what'
          echo 'Fedora ships rather than freezing whatever version was imported.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rawhide-availability
          path: |
            config/rawhide-state.json
            reports/rawhide-changed-sources.txt
          if-no-files-found: error
