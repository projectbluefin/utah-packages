name: Bootstrap direct upstream sources

on:
  push:
    branches: [main]
    paths:
      - config/hummingbird.repo
      - tools/bootstrap_upstream_sources.py
      - .github/workflows/bootstrap-direct-sources.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Imported package branch to convert
        default: import/bluefin-rawhide
        required: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: bootstrap direct sources'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create candidate branch from imported package recipes
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'import/bluefin-rawhide' }}
          BRANCH: source-bootstrap/${{ github.run_id }}
        run: |
          git fetch origin "$SOURCE_REF"
          git worktree add ../candidate FETCH_HEAD
          # The factory's own Fedora build root, pulled by its digest: rpmspec
          # evaluates these recipes with the Fedora macros they are built
          # with. An unpinned fedora:rawhide moved under every dispatch, and a
          # quay.io rawhide digest is garbage-collected within hours
          # (docs/skills/repeated-mistakes.md section 7); the mirror is never
          # pruned, and refresh-buildroot.yml moves its pin.
          BUILDROOT_IMAGE=$(python3 tools/buildroot_pin.py get)
          tag="${BUILDROOT_IMAGE%@*}"
          image="${tag%:*}@${BUILDROOT_IMAGE##*@}"
          docker pull "$image"
          # config/ is mounted whole so hummingbird.repo's gpgkey paths
          # (file:///repos/keys/...) resolve, as in every job that reads it.
          docker run --rm \
            -v "$PWD/tools:/tools:ro,Z" \
            -v "$PWD/config:/repos:ro,Z" \
            -v "$PWD/../candidate:/workspace:Z" \
            -w /workspace "$image" bash -exc '
              set -o pipefail
              # Fedora first, so rpm-build and its macros come from Fedora,
              # not from the Hummingbird builds the repo file prefers.
              dnf -y install python3 rpm-build
              cp /repos/hummingbird.repo /etc/yum.repos.d/
              # dnf5 has repoquery built in; --qf needs its own newline.
              dnf repoquery --repo public-hummingbird-x86_64-rpms --qf "%{name}\n" \
                | sort -u > reports/hummingbird-provided-packages.txt
              test -s reports/hummingbird-provided-packages.txt
              python3 /tools/bootstrap_upstream_sources.py \
                --provided-packages reports/hummingbird-provided-packages.txt \
                --provided-sources /repos/hummingbird-provided-sources.json
            '
          git -C ../candidate switch -c "$BRANCH"
          git -C ../candidate add config/upstream-sources.json reports/direct-source-bootstrap.json reports/hummingbird-provided-packages.txt
          git -C ../candidate -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] \
            commit -m 'chore: bootstrap verified direct upstream sources'
          git -C ../candidate push origin "HEAD:$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: candidate
      - name: Publish candidate handoff
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          {
            echo '## Direct-source bootstrap candidate'
            echo
            echo "Branch: \`$BRANCH\`"
            echo 'A GitHub App creates the pull request after this job. The Actions token deliberately has no pull-request authority in this organization.'
          } >> "$GITHUB_STEP_SUMMARY"
