name: Enqueue built daily bump

# repository_dispatch always executes the default-branch workflow, never the
# branch that just built, including when GITHUB_TOKEN sends the event. No
# artifacts or executable branch files cross this boundary; validate the
# candidate as Git data before minting an App token.
on:
  repository_dispatch:
    types: [bump-gate-built]

permissions: {}

concurrency:
  group: bump-upstream-enqueue-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.candidate.outputs.pr }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the successful gate and its exact candidate using main code
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          # The sender is the gate's final step. Wait for that exact run to
          # finish before trusting its conclusion or its successful handoff.
          for _ in $(seq 1 30); do
            gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > gate.json
            if [ "$(jq -r .status gate.json)" = completed ]; then break; fi
            sleep 2
          done
          jq -e --arg repo "$REPOSITORY" '
            .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/bump-upstream-gate.yml"
            and .head_repository.full_name == $repo
            and (.head_branch == "bump/upstream-sources" or .head_branch == "bump/rawhide-imports")
            and (.head_sha | test("^[0-9a-f]{40}$"))' gate.json > /dev/null
          sha=$(jq -r .head_sha gate.json)
          branch=$(jq -r .head_branch gate.json)
          attempt=$(jq -r .run_attempt gate.json)
          # A success with every job skipped is not a build verdict. Read the
          # exact attempt, including all pages of the reusable build's jobs.
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs?per_page=100" > jobs.json
          jq -e --arg sha "$sha" '
            any(.[].jobs[]; .name == "merge" and .head_sha == $sha and .conclusion == "success"
              and any(.steps[]; .name == "Ready to land the commit that built"
                and .conclusion == "success"))' jobs.json > /dev/null
          gh pr list -R "$REPOSITORY" --state open --base main --head "$branch" \
            --json number,state,baseRefName,headRefName,headRefOid,isCrossRepository > prs.json
          # The gate dispatch input is untrusted; discover the unique same-repo
          # daily PR instead, pinned to the run's immutable built head.
          jq -e --arg sha "$sha" --arg branch "$branch" '
            length == 1 and (.[0] | .state == "OPEN" and .baseRefName == "main"
              and .headRefName == $branch and .headRefOid == $sha and (.isCrossRepository | not))' prs.json > /dev/null
          git fetch --quiet origin main "$sha"
          base=$(git merge-base origin/main "$sha")
          # Never check out the candidate. This trusted tool also rejects a
          # changed workflow/tool, review-only lock update, or unknown recipe.
          python3 tools/bump_gate.py plan --base "$base" --head "$sha" > plan.json
          jq -e '.holds_only == true or (.packages | length > 0)' plan.json > /dev/null
          echo "pr=$(jq -r '.[0].number' prs.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  enqueue:
    needs: validate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # A fresh runner, no checkout and no branch tools or downloaded artifacts.
      - name: Mint a token only for this repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # Re-dispatching the gate on a rebased head needs to run its workflow.
          permission-actions: write
      - name: Enqueue the built head, or rebase + rebuild it when it fell behind main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ needs.validate.outputs.pr }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          # tools/land_bump.py re-reads the live pull request every attempt:
          # enqueue when a queue exists, merge the exact built head when the PR
          # still sits at it, or rebase onto main and re-dispatch the gate for a
          # fresh exact-head verdict when the head moved or fell behind main
          # while the gate built (the old single SHA-pinned merge 405s there).
          python3 tools/land_bump.py --repository "$REPOSITORY" --pr "$PR" --sha "$SHA"
          # Publication follows only the actual App/queue push to main.
