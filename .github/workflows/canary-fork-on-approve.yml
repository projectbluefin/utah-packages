# Start "Canary for a fork pull request" when a maintainer approves (common#1612).
#
# A maintainer reviews a fork pull request, approves it, and then presses
# canary-fork-pr.yml with the commit they reviewed. This workflow is that press:
# every 15 minutes it looks for open fork pull requests whose current head
# commit carries a GitHub Approve from someone with write access, and dispatches
# canary-fork-pr.yml for that pull request and head. The Approve is the review
# the button already relied on; nothing else changes.
#
# It starts only what that maintainer could have started by hand
# (tools/fork_canary.py approver):
#   - the Approve must be on the exact head commit (commit_id) AND the head
#     must be older than the Approve. GitHub moves a review onto a later merge
#     of main when stale reviews are not dismissed, so commit_id alone is not
#     enough; any push after the Approve, a merge of main included, needs a new
#     Approve;
#   - a standing "changes requested" from any maintainer stops it;
#   - draft pull requests and the labels hold, sentinel-alert and do-not-merge
#     stop it;
#   - reviews by bots and by the author never count.
# canary-fork-pr.yml then runs its own checks unchanged: head not moved, open
# against main, under 3000 files, and no .github/ change (those still need a
# maintainer's push).
#
# It runs once per head: it skips a head whose Canary already passed, a head that
# already has a maintainer-run Canary, and a head canary-fork-pr.yml was already
# dispatched for (its run-name names the head). A failed run is not retried; a
# maintainer decides what happens next.
#
# This workflow executes nothing from any pull request. It reads the API and
# dispatches a workflow on main, so it needs actions: write and nothing else
# beyond reads.
name: Start fork Canary on a maintainer's approval

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: canary-fork-on-approve
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Trusted code only: this workflow's own ref, which is main's tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dispatch the fork Canary for approved heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.repo.full_name != "'"$REPOSITORY"'") | .number' > forks.txt
          gh api "repos/$REPOSITORY/actions/workflows/canary-fork-pr.yml/runs?per_page=100" \
            --jq '.workflow_runs[].display_title' > started.txt
          # The list is read on fd 3 so no command in the loop can consume it.
          while read -r pr <&3; do
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::unexpected pull request number ${pr}"; exit 1; }
            gh api "repos/$REPOSITORY/pulls/$pr" > pr.json
            gh api --paginate "repos/$REPOSITORY/pulls/$pr/reviews?per_page=100" --jq '.[]' | jq -s . > reviews.json
            echo '{}' > permissions.json
            for login in $(jq -r '.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED") | .user.login // empty' reviews.json | sort -u); do
              [[ "$login" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || continue
              if ! permission=$(gh api "repos/$REPOSITORY/collaborators/$login/permission" --jq .permission); then
                echo "::warning title=fork canary::could not read ${login}'s permission on #${pr}; their review does not count"
                permission=none
              fi
              jq --arg l "$login" --arg p "$permission" '. + {($l): $p}' permissions.json > permissions.next
              mv permissions.next permissions.json
            done
            head=$(jq -r .head.sha pr.json)
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head ${head} on #${pr}"; exit 1; }
            committed_at=$(gh api "repos/$REPOSITORY/commits/$head" --jq .commit.committer.date)
            python3 tools/fork_canary.py approved --pr-json pr.json --reviews-json reviews.json \
              --permissions-json permissions.json --repository "$REPOSITORY" \
              --head-committed-at "$committed_at" | tee decision.txt
            approved_by=$(sed -n 's/^approved_by=//p' decision.txt)
            [ -n "$approved_by" ] || continue
            if grep -Fxq "Canary for fork pull request #${pr} at ${head}" started.txt; then
              echo "#$pr: already dispatched for $head"; continue
            fi
            passed=$(gh api "repos/$REPOSITORY/commits/$head/check-runs?check_name=Canary&per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            if [ "$passed" -gt 0 ]; then
              echo "#$pr: Canary already passes on $head"; continue
            fi
            proven=$(gh api "repos/$REPOSITORY/actions/workflows/canary.yml/runs?event=workflow_dispatch&branch=canary/pr-${pr}&head_sha=${head}&per_page=1" \
              --jq .total_count)
            if [ "$proven" -gt 0 ]; then
              echo "#$pr: a maintainer-run Canary already exists for $head"; continue
            fi
            echo "::notice title=fork canary::#$pr approved by $approved_by at $head; starting Canary for a fork pull request"
            gh workflow run canary-fork-pr.yml -R "$REPOSITORY" --ref main \
              -f pr="$pr" -f head_sha="$head" -f approved_by="$approved_by"
          done 3< forks.txt
