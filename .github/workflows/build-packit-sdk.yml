name: Build packit-sdk image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - containers/packit-sdk/**
      - .github/workflows/build-packit-sdk.yml
  pull_request:
    paths:
      - containers/packit-sdk/**
      - .github/workflows/build-packit-sdk.yml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build packit-sdk image
        run: |
          podman build \
            --file containers/packit-sdk/Containerfile \
            --tag localhost/packit-sdk:ci \
            containers/packit-sdk

      - name: Smoke-test packit-sdk image
        run: |
          podman run --rm localhost/packit-sdk:ci --version
          podman run --rm --entrypoint mock localhost/packit-sdk:ci --version
          podman run --rm --entrypoint createrepo_c localhost/packit-sdk:ci --version

      - name: Push packit-sdk image
        if: github.event_name != 'pull_request'
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/utah-packages-packit-sdk"

          # cosign signs by pushing to the same registry, but it reads the
          # Docker config rather than podman's own auth file, so the login has
          # to land somewhere both of them look. DOCKER_CONFIG is set on this
          # step and on the signing step to the same directory (see
          # rebuild-rpms.yml's publish job for the identical pattern).
          mkdir -p "${DOCKER_CONFIG}"
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" \
            --password-stdin --authfile "${DOCKER_CONFIG}/config.json"

          podman tag localhost/packit-sdk:ci "${image}:latest"
          podman push "${image}:latest" --digestfile digest.txt \
            --authfile "${DOCKER_CONFIG}/config.json"
          digest="$(cat digest.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${image}@${digest}"

      - name: Sign packit-sdk image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/utah-packages-packit-sdk"

          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          install -m 0755 cosign /usr/local/bin/cosign
          cosign sign "${image}@${{ steps.push.outputs.digest }}"
