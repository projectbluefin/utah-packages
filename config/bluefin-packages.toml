# Package manifest for the bluefin base image.
# Read by build_files/base/03-packages.sh via build_files/shared/read-packages.
#
# Sections:
#   [multimedia_overrides]   packages synced from fedora-multimedia repo
#   [fedora]                 base Fedora packages, all versions
#   [fedora_v42]             additions for Fedora 42 only
#   [fedora_v43]             additions for Fedora 43 only
#   [fedora_v44]             additions for Fedora 44 only
#   [excluded]               packages removed from the base image

[multimedia_overrides]
# This is the effective package transaction from Bluefin's
# build_files/base/03-packages.sh. The shell command names the Fedora
# `@multimedia` comps group, so keep its mandatory members explicit here: a
# package factory cannot promise a group without recording the binaries it
# must publish. The unsuffixed FFmpeg and FDK-AAC names are compatibility
# Provides from the factory's free-codec recipes.
packages = [
    "PackageKit-gstreamer-plugin",
    "alsa-utils",
    "ffmpeg",
    "ffmpeg-libs",
    "ffmpegthumbnailer",
    "ffmpegthumbnailer-libs",
    "gstreamer1",
    "gstreamer1-plugin-dav1d",
    "gstreamer1-plugin-libav",
    "gstreamer1-plugin-openh264",
    "gstreamer1-plugins-bad-free",
    "gstreamer1-plugins-bad-free-libs",
    "gstreamer1-plugins-base",
    "gstreamer1-plugins-good",
    "gstreamer1-plugins-ugly-free",
    "intel-gmmlib",
    "intel-mediasdk",
    "intel-vpl-gpu-rt",
    "libavcodec",
    "libavdevice",
    "libavfilter",
    "libavformat",
    "libavutil",
    "libfdk-aac",
    "libheif",
    "libjxl",
    "libva",
    "libva-intel-media-driver",
    "mesa-dri-drivers",
    "mesa-filesystem",
    "mesa-libEGL",
    "mesa-libGL",
    "mesa-libgbm",
    "mesa-vulkan-drivers",
    "lame",
    "lame-libs",
    "libswresample",
    "libswscale",
    "pipewire-alsa",
    "pipewire-config-raop",
    "pipewire-gstreamer",
    "pipewire-libs",
    "pipewire-pulseaudio",
    "pipewire-utils",
    "wireplumber",
]

[hummingbird_provided]
# Fedora's multimedia group includes this binary, but the pinned Hummingbird
# base image already owns it. Keeping it outside [multimedia_overrides] stops
# the Rawhide importer from rebuilding alsa-lib while still making the
# exception visible to the gap report and the committed closure inventory.
packages = [
    "alsa-ucm",
]

[multimedia_sources.source_by_binary]
# Names supplied by Bluefin are not always the source recipe's binary name.
# In particular, Fedora's multimedia/free-codec builds expose FFmpeg and
# FDK-AAC through compatibility Provides. This map lets the Rawhide importer
# use the source recipe already staged in the factory when standard Rawhide
# does not expose the free-world binary name.
ffmpeg = "ffmpeg"
ffmpeg-libs = "ffmpeg"
libavcodec = "ffmpeg"
libavdevice = "ffmpeg"
libavfilter = "ffmpeg"
libavformat = "ffmpeg"
libavutil = "ffmpeg"
libfdk-aac = "fdk-aac-free"
gstreamer1-plugin-openh264 = "gstreamer1-plugins-bad-free"
libva-intel-media-driver = "intel-media-driver-free"

