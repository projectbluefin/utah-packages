# Consumer transaction validated before the factory's OCI repository can move.
# Bluefin's manifest is kept separately so its copied sections can be compared
# with upstream; this file adds Utah's Hummingbird desktop requirements and the
# explicit, issue-backed parity debt.

[base]
# Must match Utah's BASE_IMAGE pin. The closure transaction runs inside this
# image because Hummingbird intentionally supplies part of its dependency set
# through the bootc base RPM database rather than its public Pulp repository.
image = "quay.io/hummingbird-community/bootc-os:latest@sha256:c5539f9ed4d93aab6bd41e4f5aef8ab83055f3f9e855a47b69fadb7420d0d1df"

[bluefin]
# The explicit multimedia_overrides expansion is part of Bluefin's effective
# install transaction, including the mandatory members of @multimedia.
sections = [
  "fedora",
  "fedora_v43",
  "multimedia_overrides",
]

[utah]
packages = [
  "fwupd",
  "gnome-control-center",
  "gnome-session",
  "gnome-settings-daemon",
  "gnome-shell",
  "gsettings-desktop-schemas",
  "gtk4",
  "libadwaita",
  "mutter",
  "tailscale",
  "xdg-desktop-portal",
  "xdg-desktop-portal-gnome",
]

[unavailable]
# Each exception is tracked in the consumer or factory issue tracker. Keeping
# it in this transaction means publication validates the same known debt Utah
# currently carries rather than silently widening it.
packages = [
  # Bluefin carries this as an installer web-engine dependency. Utah uses the
  # bootc-installer live path, not Anaconda WebUI or Slitherer.
  "slitherer",
  "evolution-ews-core",
  "fish",
  "tailscale",
  "zsh",
]
