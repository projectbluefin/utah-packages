# Factory build backlog — see projectbluefin/utah-packages#308.
#
# Audit basis: hanthor's 2026-09-30 bare-metal diff of Bluefin classic
# (1806 names) minus Utah (1053 names), minus 218 names Hummingbird
# already supplies, minus 33 names the pinned factory repo already
# builds. The remainder is 551 names that need a factory build or
# an explicit wontfix; this catalog is the surface the auditor tracks.
#
# Methodology: each area is a cluster from issue #308's suggested
# priority list, so the area label matches the language the audit
# already speaks. The auditor (tools/factory_build_backlog.py)
# cross-references each entry against `packages/`,
# `config/upstream-sources.json`, `.packit.yaml`, and
# `config/bluefin-packages.toml` to mark each entry as
# already-built, in-progress, or pending.
#
# A name added here MUST also appear in the audited list referenced
# by `[meta].audit_source`; the contract test
# `tests/test_factory_build_backlog.py::CatalogConsistencyTests::test_real_catalog_matches_the_audit_count`
# pins both the total and the SHA-256 of the sorted audited names. The
# auditor also checks that digest across areas + [resolved] + [wontfix], so
# replacing one audited name with a stray name fails even at equal count.
#
# Removing a name requires two edits: drop it here AND mark it in
# `[resolved]` (recipe imported) or `[wontfix]` (decided not to
# carry, with a reason), so the count never silently shrinks.

