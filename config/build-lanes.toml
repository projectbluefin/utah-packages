# Scheduling overrides for the conservative numeric source stages.
# Packages not listed here remain in their numeric stage. A late lane may only
# consume outputs from the preceding fast lane(s) named in the workflow.

[stage1_heavy]
packages = ["mozjs140", "webkitgtk"]

[stage2_late]
packages = ["gjs"]

[stage3_late]
packages = ["evolution-data-server", "gnome-shell"]
