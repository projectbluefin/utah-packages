repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # v4.6.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      # Imported spec files and patches are upstream bytes. Reformatting them
      # changes what we ship and what the source locks describe.
      - id: end-of-file-fixer
        exclude: ^packages/
      - id: trailing-whitespace
        exclude: ^packages/
  - repo: https://github.com/rhysd/actionlint
    rev: 03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: no-floating-action-tags
        name: Block floating GitHub Action tags (@main, @v*)
        language: pygrep
        entry: 'uses:(?!.*projectbluefin/).*@(main|master|latest|v[0-9])'
        types: [yaml]
        files: '\.github/workflows/'
      - id: factory-contract
        name: Validate the factory onboarding contract
        language: system
        entry: python3 tools/factory_contract.py
        pass_filenames: false
        always_run: true
      - id: workflow-quoting
        name: Validate workflow shell quoting
        language: system
        entry: python3 tools/check_workflow_quoting.py
        pass_filenames: false
        always_run: true
