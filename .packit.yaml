# Root-level Packit monorepo config, consumed only by the
# packit-srpm-pilot CI job (.github/workflows/packit-srpm-pilot.yml).
#
# Scope and rationale:
# docs/superpowers/specs/2026-09-05-packit-srpm-pilot-design.md
#
# This does not replace or read the per-package .packit.yaml files
# shipped inside packages/*/ -- those are unmodified, unused Fedora
# dist-git imports, left in place on purpose (see the design doc).
#
# All 54 packages that carry a leftover .packit.yaml are listed below.
# The workflow runs the factory's verified-source pipeline before Packit,
# staging the locked upstream archive and any Fedora lookaside sources
# beside each spec.
