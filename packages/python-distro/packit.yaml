upstream_project_url: https://github.com/python-distro/distro
upstream_tag_template: v{version}
copy_upstream_release_description: false

jobs:
- job: pull_from_upstream
  trigger: release
  dist_git_branches:
    - rawhide

- job: koji_build
  trigger: commit
  allowed_committers: ['packit']
  dist_git_branches:
    - fedora-all

- job: bodhi_update
  trigger: commit
  dist_git_branches:
    - fedora-all
