jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide

  - job: koji_build
    require:
      label:
        absent:
          - side-tag
          - sidetag
    trigger: commit
    allowed_pr_authors:
      - all_admins
      - packit
    dist_git_branches:
      - fedora-all

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-all
