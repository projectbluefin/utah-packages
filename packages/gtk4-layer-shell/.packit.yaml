# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: gtk4-layer-shell.spec

upstream_project_url: https://github.com/wmww/gtk4-layer-shell
upstream_tag_template: v{version}

jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide
      # - fedora-development
      # - fedora-all

  - job: koji_build
    trigger: commit
    allowed_pr_authors: ["packit", "atim"]
    allowed_committers: ["packit", "atim"]
    dist_git_branches:
      - fedora-all
      # - epel-10

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
      # - epel-10
